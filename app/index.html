.fm-card{gap:10px}
.warnline{flex-direction:row;align-items:flex-start;gap:10px;padding:12px 16px;border:1px solid var(--bad);background:transparent}
.warnline>span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.warnline p{margin:0;font-size:14px;line-height:1.45}
.fm-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fm-amt{font-family:var(--display);font-size:34px;font-weight:500;line-height:1.1}
.fm-to{font-weight:700;color:var(--ink)}
.fm-bar{height:8px;border-radius:999px;background:var(--band);overflow:hidden}
.fm-bar i{display:block;height:100%;background:var(--gold)}
.fm-card .btn{align-self:flex-start}

.rest{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.rest .lbl{margin:0}

.imp-sheet{max-height:min(88vh,760px);overflow:auto}
@media (min-width:900px){.imp-sheet{max-width:720px}}
.imp-drop{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:22px;cursor:pointer}
.imp-drop input{max-width:100%;font:inherit}
.imp-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;max-height:46vh;overflow:auto}
.imp-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:'k d n' 'k s s';gap:4px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:0}
.imp-row .chk{grid-area:k}.imp-d{grid-area:d;min-width:0}.imp-row select{grid-area:s;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}.imp-row .num{grid-area:n}
.imp-d b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-d small{font-size:12px;color:var(--muted)}
.imp-row.off{opacity:.55}
.imp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
@media (min-width:600px){.imp-row{grid-template-columns:30px minmax(0,1fr) 180px 90px;grid-template-areas:'k d s n'}.imp-row .num{text-align:right}}

 cost to see if he has the resources to complete it?", "Count the cost before you build. That is all a spending plan is.", "Which of you, wishing to build a tower, does not first sit down and count the cost…"], ["w", "Proverbs 10:4", "Idle hands make one poor, but diligent hands bring wealth.", "Diligence, not luck, is what builds wealth.", "Idle hands make one poor, but diligent hands bring wealth."], ["c", "John 15:13", "Greater love has no one than this, that he lay down his life for his friends.", "Love gives itself away. Let generosity mark how you handle money.", "Greater love has no one than this, that he lay down his life for his friends."], ["l", "Ecclesiastes 2:11", "Yet when I considered all the works that my hands had accomplished and what I had toiled to achieve, I found everything to be futile, a pursuit of the wind; there was nothing to be gained under the sun.", "Even Solomon, the richest of kings, found that achievement alone leaves you empty.", "…I found everything to be futile, a pursuit of the wind; there was nothing to be gained under the sun."], ["m", "Proverbs 27:23–24", "Be sure to know the state of your flocks, and pay close attention to your herds; for riches are not forever, nor does a crown endure to every generation.", "Know your numbers. Check your balance now and then, because riches are not forever.", "Be sure to know the state of your flocks, and pay close attention to your herds…"], ["w", "Proverbs 14:23", "There is profit in all labor, but mere talk leads only to poverty.", "Talking about a plan is not a plan. Do the work.", "There is profit in all labor, but mere talk leads only to poverty."], ["c", "Ephesians 3:19", "…to know this love that surpasses knowledge, that you may be filled with all the fullness of God.", "The love of Christ is the one wealth no one can measure.", "…to know this love that surpasses knowledge, that you may be filled with all the fullness of God."], ["l", "James 4:14", "You do not even know what will happen tomorrow! What is your life? You are a mist that appears for a little while and then vanishes.", "Plan for tomorrow, but hold your plans loosely.", "…What is your life? You are a mist that appears for a little while and then vanishes."], ["m", "Romans 13:8", "Be indebted to no one, except to one another in love. For he who loves his neighbor has fulfilled the law.", "The only debt worth carrying is love.", "Be indebted to no one, except to one another in love.…"], ["w", "Ecclesiastes 9:10", "Whatever you find to do with your hands, do it with all your might, for in Sheol, where you are going, there is no work or planning or knowledge or wisdom.", "Sheol is the grave. Your time to work is now, so give it your full strength.", "Whatever you find to do with your hands, do it with all your might…"], ["c", "1 John 4:19", "We love because He first loved us.", "We give and serve in answer to His love, not to earn it.", "We love because He first loved us."], ["l", "Psalm 39:6", "Surely every man goes about like a phantom; surely he bustles in vain; he heaps up riches not knowing who will haul them away.", "Don't just heap it up. Know what your money is for.", "…he heaps up riches not knowing who will haul them away."], ["m", "Proverbs 21:20", "Precious treasures and oil are in the dwelling of the wise, but a foolish man consumes them.", "The wise keep something in store. The foolish spend it all. Build your cushion.", "Precious treasures and oil are in the dwelling of the wise, but a foolish man consumes them."], ["w", "Proverbs 22:29", "Do you see a man skilled in his work? He will be stationed in the presence of kings; he will not stand before obscure men.", "Get excellent at what you do. Skill opens doors that money can't.", "Do you see a man skilled in his work? He will be stationed in the presence of kings…"], ["c", "Matthew 11:28–29", "Come to Me, all you who are weary and burdened, and I will give you rest. Take My yoke upon you and learn from Me, for I am gentle l also be faithful with much…"], ["w", "Galatians 6:9", "Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up.", "Results come in due time. Keep going when progress feels slow.", "Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up."], ["c", "Matthew 6:33", "But seek first the kingdom of God and His righteousness, and all these things will be added unto you.", "Get the order right: God first, then the plan.", "But seek first the kingdom of God and His righteousness…"], ["l", "Mark 8:36", "What does it profit a man to gain the whole world, yet forfeit his soul?", "No freedom number is worth your soul.", "What does it profit a man to gain the whole world, yet forfeit his soul?"], ["m", "1 Timothy 6:10", "For the love of money is the root of all kinds of evil. By craving it, some have wandered away from the faith and pierced themselves with many sorrows.", "Money is not evil. Loving it is. Make money serve you, and never serve it.", "For the love of money is the root of all kinds of evil.…"], ["w", "1 Timothy 5:8", "If anyone does not provide for his own, and especially his own household, he has denied the faith and is worse than an unbeliever.", "Providing for your family is part of your faith, not separate from it.", "If anyone does not provide for his own, and especially his own household, he has denied the faith…"], ["c", "2 Corinthians 8:9", "For you know the grace of our Lord Jesus Christ, that though He was rich, yet for your sake He became poor, so that you through His poverty might become rich.", "Christ gave up riches for us. Our truest wealth is in Him.", "…though He was rich, yet for your sake He became poor…"], ["l", "Psalm 90:12", "So teach us to number our days, that we may present a heart of wisdom.", "We count our dollars carefully. Count your days even more carefully.", "So teach us to number our days, that we may present a heart of wisdom."], ["m", "Hebrews 13:5" udgment.", "Tend your own field. Chasing get-rich schemes leaves you empty.", "The one who works his land will have plenty of food, but whoever chases fantasies lacks judgment."], ["c", "Galatians 2:20", "I have been crucified with Christ, and I no longer live, but Christ lives in me. The life I live in the body, I live by faith in the Son of God, who loved me and gave Himself up for me.", "He loved me and gave Himself for me. Everything else grows from that.", "…I live by faith in the Son of God, who loved me and gave Himself up for me."], ["l", "Ecclesiastes 12:13", "When all has been heard, the conclusion of the matter is this: Fear God and keep His commandments, because this is the whole duty of man.", "After all the searching, this is what matters.", "…Fear God and keep His commandments, because this is the whole duty of man."], ["m", "Proverbs 13:22", "A good man leaves an inheritance to his children’s children, but the sinner’s wealth is passed to the righteous.", "Think past yourself. What you invest today can bless your grandchildren.", "A good man leaves an inheritance to his children’s children…"], ["l", "Proverbs 23:4–5", "Do not wear yourself out to get rich; be wise enough to restrain yourself. When you glance at wealth, it disappears, for it makes wings for itself and flies like an eagle to the sky.", "Work hard, but don't wear yourself out chasing riches. They can fly away overnight.", "Do not wear yourself out to get rich; be wise enough to restrain yourself.…"], ["m", "Proverbs 3:9–10", "Honor the LORD with your wealth and with the firstfruits of all your crops; then your barns will be filled with plenty, and your vats will overflow with new wine.", "Give first, not last. Put giving in your spending plan before the extras.", "Honor the LORD with your wealth and with the firstfruits of all your crops…"], ["m", "2 Corinthians 9:7", "Each one should give what he has decided in his heart to give, not out of regret or compulsion. For God loves a cheerful giver.", "Give on purpose, and give gladly.", "…For God loves a cheerful giver."], ["m", "Matthew 25:21", "His master replied, “Well done, good and faithful servant! You have been faithful with a few things; I will put you in charge of many things. Enter into the joy of your master!”", "The servants who put their money to work were praised. Money buried in the ground does nothing.", "…Well done, good and faithful servant! You have been faithful with a few things…"], ["m", "Matthew 25:27", "Then you should have deposited my money with the bankers, and on my return I would have received it back with interest.", "Even the master said it: at the very least, put your money where it earns. Don't let it sit idle.", "…you should have deposited my money with the bankers, and on my return I would have received it back with interest."]];

  $('sheet').innerHTML='<div class="sheet-bg" id="sbg"><form class="sheet imp-sheet" id="impf" aria-label="Import a statement"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-family:var(--display);font-size:24px">Import a statement</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>'+
    '<div id="imp-body"><p class="note">In your bank or credit card’s online banking, open the account and choose <b>Download</b> or <b>Export transactions</b>, then pick <b>CSV</b>. Works with most Canadian banks and cards.</p>'+
    '<label class="imp-drop"><input type="file" id="imp-file" accept=".csv,text/csv,text/plain"><b>Choose a CSV file</b><span class="note">The file is read on this device only. Nothing is uploaded.</span></label>'+
    '<p class="note" id="imp-err" style="color:var(--bad)"></p></div></form></div>';
  $('sheet').hidden=false;track('import_opened');
  $('sbg').addEventListener('click',function(e){if(e.target.id==='sbg')closeLog()});
  $('imp-file').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){var P=parseStatement(rd.result);if(P.err){$('imp-err').textContent=P.err;track('import_failed');return}impReview(P,false,f.name)};
    rd.onerror=function(){$('imp-err').textContent='I couldn’t read that file.'};rd.readAsText(f)});
}
function impReview(P,flip,name){var L=impBuild(P,flip),CL=cats(),pick=L.map(function(x){return !x.dup&&!x.skip});
  var other=P.rows.length-L.length;
  function draw(){var n=pick.filter(Boolean).length,tot=L.reduce(function(s,x,i){return s+(pick[i]?x.a:0)},0);
    var dts=L.map(function(x){return x.dt}).sort();
    $('imp-body').innerHTML='<p class="note"><b>'+esc(name||'Your file')+'</b>: '+L.length+' purchase'+(L.length===1?'':'s')+(dts.length?' from '+fd(parse(dts[0]),{month:'short',day:'numeric'})+' to '+fd(parse(dts[dts.length-1]),{month:'short',day:'numeric'}):'')+(other>0?'. Skipped '+other+' deposit'+(other>1?'s':'')+' and credit'+(other>1?'s':'')+'.':'.')+' Unticked: transfers, bill and card payments, and anything already imported.</p>'+
      '<div class="imp-list">'+L.map(function(x,i){return '<div class="imp-row'+(pick[i]?'':' off')+'"><button type="button" class="chk" aria-pressed="'+pick[i]+'" data-imp="'+i+'" aria-label="Include '+esc(x.desc)+'">'+(pick[i]?'✓':'')+'</button><span class="imp-d"><b>'+esc(x.desc||'Purchase')+'</b><small>'+fd(parse(x.dt),{month:'short',day:'numeric'})+(x.dup?' · already imported':x.skip?' · looks like a transfer or payment':'')+'</small></span><select data-impc="'+i+'" aria-label="Category">'+CL.map(function(c){return '<option'+(c===x.c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select><b class="num">'+money(x.a,1)+'</b></div>'}).join('')+'</div>'+
      '<div class="imp-foot"><button type="button" class="btn ghost sm" data-impflip="1">Purchases look like deposits? Flip</button><button type="submit" class="btn"'+(n?'':' disabled')+'>Add '+n+' purchase'+(n===1?'':'s')+' · '+money(tot)+'</button></div>'}
  draw();
  var body=$('imp-body');
  body.onclick=function(e){var b=e.target.closest('[data-imp]');if(b){var i=+b.dataset.imp;pick[i]=!pick[i];draw();return}if(e.target.closest('[data-impflip]')){impReview(P,!flip,name)}};
  body.onchange=function(e){var sl=e.target.closest('[data-impc]');if(sl)L[+sl.dataset.impc].c=sl.value};
  $('impf').onsubmit=function(e){e.preventDefault();var n=0,base=Date.now();L.forEach(function(x,i){if(!pick[i])return;S.spend.push({id:base+n,dt:x.dt,a:Math.round(x.a*100)/100,c:x.c,note:x.desc.slice(0,40),imp:x.key});n++});
    if(!n)return;track('statement_imported',{rows:n});if(S.example)S.example=false;changed();closeLog();R[cur]();toast('Added '+n+' purchase'+(n===1?'':'s'))};
}
function openLog(pre){
  var CL=cats(),sel=pre&&CL.indexOf(pre)>-1?pre:CL[0];
  $('sheet').innerHTML='<div class="sheet-bg" id="sbg"><form class="sheet" id="logf" aria-label="Log spending"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-family:var(--display);font-size:24px">Log spending</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>'+
    '<label class="amt"><span aria-hidden="true">$</span><input id="l-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0" aria-label="Amount"></label>'+
    '<div class="chips" id="l-cats">'+CL.map(function(c,i){return '<button type="button" class="chip" data-c="'+esc(c)+'" aria-pressed="'+(c===sel)+'">'+esc(c)+'</button>'}).join('')+'</div>'+
    '<div class="grid2"><label class="field">Note (optional)<input id="l-note" maxlength="40"></label><label class="field">Date<input id="l-dt" type="date" value="'+iso(d0())+'"></label></div>'+
    '<p class="note" id="l-err" style="color:var(--bad)"></p><button class="btn" type="submit">Save</button></form></div>';
  $('sheet').hidden=false;setTimeout(function(){try{$('l-amt').focus()}catch(e){}},50);
  $('l-cats').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;sel=b.dataset.c;[].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b)})});
  $('sbg').addEventListener('click',function(e){if(e.target.id==='sbg')closeLog()});
  $('logf').addEventListener('submit',function(e){e.preventDefault();var a=+$('l-amt').value;if(!(a>0)){$('l-err').textContent='Enter how much you spent.';return}
    track('spend_logged',{category:sel});S.spend.push({id:Date.now(),dt:$('l-dt').value||iso(d0()),a:Math.round(a*100)/100,c:sel,note:$('l-note').value.trim()});changed();closeLog();R[cur]();toast('Logged '+money(a,1))});
}
function closeLog(){$('sheet').hidden=true;$('sheet').innerHTML=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').hidden)closeLog();if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.fs!=null){e.preventDefault();e.target.click()}});

document.addEventListener('click',function(e){
  var fr=e.target.closest('[data-fs]');if(fr){var fk=+fr.dataset.fs;stepOpen[fk]=!stepOpen[fk];track('step_open',{step:fk+1});renderGoals();try{document.querySelector('[data-fs="'+fk+'"]').focus({preventScroll:true})}catch(x){}return}
  var tr=e.target.closest('[data-track]');if(tr)track(tr.dataset.track);
  var t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('tab'))return show(t.dataset.v);
  if(t.dataset.go)return show(t.dataset.go);
  if(t.dataset.paid){var id=t.dataset.paid;if(S.paid[id])delete S.paid[id];else{S.paid[id]=1;track('bill_paid')}changed();return renderToday()}
  if(t.dataset.del){var di=S.spend.findIndex(function(x){return String(x.id)===t.dataset.del});if(di>-1){undoBuf={l:'spend',i:di,v:S.spend.splice(di,1)[0]}}changed();renderSpend();return toast('Purchase deleted',true)}
  if(t.dataset.add){S[t.dataset.add].push(t.dataset.add==='bills'?{n:BILLS.filter(function(c){return !S.bills.some(function(x){return x.n===c})})[0]||'Other bill',a:0,d:1}:t.dataset.add==='plan'?{c:CATS.filter(function(c){return !S.plan.some(function(x){return x.c===c})})[0]||'Other',a:0}:t.dataset.add==='incomes'?{n:'Other income',a:0,freq:'monthly',last:iso(d0())}:t.dataset.add==='cards'?{n:'Another card',due:1}:{n:DEBTS.filter(function(c){return !S.debts.some(function(x){return x.n===c})})[0]||'Other debt',b:0,r:0,m:0,d:1});changed();return renderPlan()}
  if(t.dataset.rm){var lst=t.dataset.rm,ix=+t.dataset.i,gone=S[lst].splice(ix,1)[0];undoBuf={l:lst,i:ix,v:gone};changed();renderPlan();return toast('Removed '+(gone&&(gone.n||gone.c)||'item'),true)}
  if(t.dataset.act==='undo'&&undoBuf){S[undoBuf.l].splice(undoBuf.i,0,undoBuf.v);undoBuf=null;$('toast').hidden=true;changed();return show(cur)}
  if(t.dataset.mv){var mk=mkey()+':'+t.dataset.mv;S.moved=S.moved||{};if(S.moved[mk])delete S.moved[mk];else{S.moved[mk]=Date.now();track('payday_moved',{what:t.dataset.mv})}changed();return renderToday()}
  if(t.dataset.rv!=null){var on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',on);$('rvo-'+t.dataset.rv).hidden=!on;if(on)try{$('rva-'+t.dataset.rv).focus()}catch(e){}return}
  if(t.dataset.method){S.method=t.dataset.method;track('debt_method',{method:S.method});changed(true);return renderGoals()}
  if(t.dataset.kids!=null){S.kids=t.dataset.kids==='1';changed(true);return renderPlan()}
  if(t.dataset.roll!=null){var dd=S.debts[+t.dataset.roll];if(dd){S.push=Math.round(((+S.push||0)+(+dd.m||0)/PPM[S.pay.freq])*100)/100;dd.rolled=true;track('debt_rolled');changed(true);toast('Rolled in. Freedom money is now '+money(S.push))}return renderToday()}
  if(t.dataset.pm){S.planMode=t.dataset.pm;track('plan_mode',{mode:S.planMode});changed(true);return renderPlan()}
  if(t.dataset.psec){S.pSec=t.dataset.psec;save();track('plan_section',{section:S.pSec});renderPlan();var sc=$('scroller')||document.scrollingElement;try{sc.scrollTo({top:0,behavior:'smooth'})}catch(x){sc.scrollTop=0}return}
  if(t.dataset.view){S.view=t.dataset.view;track('view_mode',{view:S.view});changed(true);return renderPlan()}
  if(t.dataset.card!=null){S.card.on=t.dataset.card==='1';if(S.card.on)S.view='month';track('pay_method',{card:S.card.on});changed(true);return renderPlan()}
  if(t.dataset.faith!=null){S.faith=t.dataset.faith==='1';track('faith_toggle',{on:S.faith});changed(true);return renderPlan()}
  if(t.dataset.act==='word-next'){wordOff=(wordOff+1)%WORD.length;track('word_next');var wc=t.closest('.word');if(wc){var d=document.createElement('div');d.innerHTML=wordCard();wc.replaceWith(d.firstChild)}return}
  if(t.dataset.logc)return openLog(t.dataset.logc);
  var ch=t.closest('[data-set]');if(ch&&t.dataset.v){S.goal[ch.dataset.set]=+t.dataset.v;changed();return renderGoals()}
  switch(t.dataset.act){
    case 'log':return openLog();
    case 'import':return openImport();
    case 'bal':return openBal();
    case 'recv':return openRecv();

    case 'review-save':var lk=reviewTarget().key,o={},n=0;S.plan.forEach(function(c,i){var b=document.querySelector('[data-rv="'+i+'"]');if(b&&b.getAttribute('aria-pressed')==='true'){o[c.c]=+$('rva-'+i).value||0;n++}});S.review=S.review||{};S.review[lk]=o;track('review_done',{over:n});changed();toast(n?'Saved. '+n+' categor'+(n>1?'ies':'y')+' went over':'Saved. All within plan');return renderToday();
    case 'close':return closeLog();
    case 'copy':track('summary_copied');return copy($(t.dataset.t).value,$(t.dataset.t));
    case 'backup':track('backup_copied');var s=JSON.stringify(S);return copy(s,null);
    case 'restore':$('restoreBox').hidden=!$('restoreBox').hidden;return;
    case 'restore-go':try{var o=JSON.parse($('restoreTxt').value);if(!o||!(o.pay||o.incomes)||!Array.isArray(o.bills))throw 0;S=o;migrate();save();toast('Backup restored');return show('today')}catch(err){$('restoreMsg').textContent='That doesn’t look like a Melius Money backup. Copy it again and paste the whole thing.';return}
    case 'ask-fresh':case 'ask-example':var fresh=t.dataset.act==='ask-fresh';
      $('confirmBox').innerHTML='<div class="confirm"><b>'+(fresh?'Clear everything on this device?':'Replace your numbers with the example?')+'</b><span class="note">This can’t be undone. Copy a backup first if you want to keep your numbers.</span><div class="chips"><button class="btn danger sm" data-act="'+(fresh?'do-fresh':'do-example')+'">Yes, '+(fresh?'clear it':'load example')+'</button><button class="btn ghost sm" data-act="cancel">Cancel</button></div></div>';return;
    case 'cancel':$('confirmBox').innerHTML='';return;
    case 'do-fresh':track('setup_started');S=blank();migrate();save();toast('Cleared');return show('plan');
    case 'use-sug':var sg=suggestPush().month;S.pushM=sg;syncPush();track('freedom_suggest_used',{amount:sg,from:cur});changed(true);R[cur]();toast('Freedom money set to '+money(sg)+' a month');return;
    case 'do-example':track('example_loaded');S=example();migrate();(function(){var t=d0();dueIn({prev:new Date(t.getFullYear(),t.getMonth(),1,12),next:t}).forEach(function(b){S.paid[b.id]=1})})();save();toast('Example loaded');return show('today');
  }
});


/* live updates while typing: apply the value, save, and refresh every card except the one being typed in */
function applyLive(el){
  var id=el.id,v=el.value;
  if(id==='p-push'){S.pushM=+v||0;syncPush()}else if(id==='p-cush')S.cushion=+v||0;
  else if(id==='g-need')S.goal.need=+v||0;else if(id==='g-inv')S.goal.invested=+v||0;
  else if(el.dataset.k){var row=el.closest('[data-row]');if(!row)return false;var it=S[row.dataset.row][+row.dataset.i],k=el.dataset.k;if(!it)return false;
    it[k]=(k==='n'||k==='c'||k==='freq'||k==='last')?v:(+v||0);}
  else return false;
  if(S.incomes[0]){S.pay=S.incomes[0];S.pay.amount=+S.pay.a||0}
  return true;
}
function livePatch(){
  var real=$('v-'+cur),act=document.activeElement,card=act&&act.closest('#v-'+cur+' > *');if(!real)return;
  var kids=[].slice.call(real.children),fi=kids.indexOf(card);
  real.id='v-live-tmp';var tmp=document.createElement('section');tmp.id='v-'+cur;tmp.hidden=true;document.body.appendChild(tmp);
  try{R[cur]();var nk=[].slice.call(tmp.children);if(nk.length===kids.length)nk.forEach(function(n,j){if(j!==fi)kids[j].replaceWith(n);else [].forEach.call(n.querySelectorAll('[data-live]'),function(x){var o=kids[j].querySelector('[data-live="'+x.dataset.live+'"]');if(o)o.innerHTML=x.innerHTML})})}catch(e){}
  tmp.remove();real.id='v-'+cur;
}
function flashSaved(){var t=$('savedTag');if(!t)return;t.textContent='Saved ✓';t.classList.add('on');clearTimeout(flashSaved.t);flashSaved.t=setTimeout(function(){t.classList.remove('on')},1400)}
document.addEventListener('input',function(e){
  var el=e.target;if(el.tagName==='SELECT'||!el.closest('#v-plan,#v-goals'))return;
  if(!applyLive(el))return;
  if(S.example)S.example=false;save();$('exTag').hidden=!S.example;flashSaved();
  clearTimeout(livePatch.t);livePatch.t=setTimeout(livePatch,250);
});
document.addEventListener('change',function(e){
  var el=e.target,id=el.id;
  if(id==='p-push'){S.pushM=+el.value||0;syncPush()}
  else if(id==='p-cush')S.cushion=+el.value||0;
  else if(id==='g-need')S.goal.need=+el.value||0;
  else if(id==='g-inv')S.goal.invested=+el.value||0;
  else if(el.dataset.k){var row=el.closest('[data-row]');if(!row)return;var it=S[row.dataset.row][+row.dataset.i],k=el.dataset.k;if(el.value==='__other'&&el.tagName==='SELECT'){it.custom=true;it[k]='';changed(true);renderPlan();try{document.querySelector('[data-row="'+row.dataset.row+'"][data-i="'+row.dataset.i+'"] input[data-k='+k+']').focus()}catch(e){}return}
  it[k]=(k==='n'||k==='c'||k==='freq'||k==='last')?el.value:k==='atk'?el.value==='1':(+el.value||0);if(k==='due'){it.due=Math.min(31,Math.max(1,Math.round(+el.value||1)));el.value=it.due}
  if(k==='atk'||k==='freq'){changed(true);return renderPlan()}if(k==='d')it[k]=Math.min(31,Math.max(1,Math.round(it[k]||1)))}
  else return;
  if(S.incomes[0]){S.pay=S.incomes[0];S.pay.amount=+S.pay.a||0}
  if(!S.setupDone&&(+S.pay.amount>0)&&S.bills.length){S.setupDone=true;track('setup_completed',{bills:S.bills.length,frequency:S.pay.freq})}
  changed(true);flashSaved();if(cur==='plan'&&$('sum'))$('sum').value=summary();
});

if(EMBED)track('app_preview_view');else{track('app_open',{own_numbers:!S.example,returning:!!S.seen});if(!S.seen){S.seen=1;save()}}
show('today');
})();
</script>

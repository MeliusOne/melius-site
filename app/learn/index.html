<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melius Learn</title>
<meta name="description" content="Learn income investing in Canada, two minutes a day.">
<meta name="theme-color" content="#14213D">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-m1-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-m1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F4F2EC;--surface:#FFFFFF;--band:#F9F7F2;--ink:#14213D;--muted:#5A6474;--line:#E3DED3;--accent:#1D3557;--accent-ink:#FFFFFF;--gold:#A8803F;--gold-soft:#F3EBDC;--good:#2E7D5B;--good-soft:#E3F2EA;--bad:#A3332A;--bad-soft:#F8E3E0;--lock:#C9C3B6;--hero:#14213D;--hero-ink:#F7F5F0;--hero-mute:#B9C2D3;--shadow:0 10px 28px rgba(20,33,61,.12);--display:'Newsreader',Georgia,'Times New Roman',serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#142036;--band:#111B2E;--ink:#EEF1F6;--muted:#A9B3C4;--line:#26344D;--accent:#C9A76B;--accent-ink:#0E1626;--gold:#C9A76B;--gold-soft:#2B2719;--good:#6CC79C;--good-soft:#15302A;--bad:#E5776C;--bad-soft:#3A1D1B;--lock:#35445E;--hero:#142036;--hero-ink:#EEF1F6;--hero-mute:#A9B3C4;--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--surface:#142036;--band:#111B2E;--ink:#EEF1F6;--muted:#A9B3C4;--line:#26344D;--accent:#C9A76B;--accent-ink:#0E1626;--gold:#C9A76B;--gold-soft:#2B2719;--good:#6CC79C;--good-soft:#15302A;--bad:#E5776C;--bad-soft:#3A1D1B;--lock:#35445E;--hero:#142036;--hero-ink:#EEF1F6;--hero-mute:#A9B3C4;--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand img{width:32px;height:32px;border-radius:50%}
.brand b{font-family:var(--display);font-weight:600;font-size:20px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip svg{width:18px;height:18px}
.chip.flame{color:var(--gold)}
.chip.flame.off{color:var(--muted)}
.chip.xp{color:var(--good)}

main{padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}

/* today card */
.today{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:72px;height:72px;position:relative}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:rgba(255,255,255,.14)}
.ring .fgc{stroke:#C9A76B;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.today h1{margin:0;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2;text-wrap:balance}
.today p{margin:4px 0 0;color:var(--hero-mute);font-size:14px}
.today .go{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;border-radius:14px;background:#C9A76B;color:#14213D;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #8E6F3A}
.today .go:active{transform:translateY(3px);box-shadow:0 1px 0 #8E6F3A}

/* units and path */
.unit{margin-top:28px}
.unit-hd{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.unit-hd .n{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:600;background:var(--gold-soft);color:var(--gold)}
.unit-hd h2{margin:0;font-size:17px;font-weight:800;line-height:1.25}
.unit-hd p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.unit-hd .tag{margin-left:auto;flex:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.unit.live .unit-hd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.unit.live .unit-hd p{color:inherit;opacity:.78}
.unit.live .unit-hd .n{background:rgba(255,255,255,.16);color:inherit}
.soon-h{margin:34px 0 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.soon-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.soon-l li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14.5px}
.soon-l li b{color:var(--ink);font-weight:700}
.soon-l .n{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:600;background:var(--gold-soft);color:var(--gold)}
.path{list-style:none;margin:8px 0 0;padding:44px 0 6px;display:flex;flex-direction:column;align-items:center;gap:40px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;transform:translateX(var(--x,0))}
.node button{position:relative;width:74px;height:70px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--lock);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.node button svg{width:30px;height:30px}
.node button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.node.done button{background:var(--gold);box-shadow:0 6px 0 #7B5D2C}
.node.cur button{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 rgba(0,0,0,.28)}
.node.cur button::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);opacity:.35;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.18);opacity:0}}
.node .lbl{font-size:13.5px;font-weight:700;text-align:center;line-height:1.25;color:var(--ink)}
.node.lock .lbl{color:var(--muted);font-weight:600}
.node .start{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--accent);border:2px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

/* terms */
.terms h1{font-family:var(--display);font-weight:500;font-size:28px;margin:0}
.terms>p{color:var(--muted);margin:4px 0 16px}
.tlist{display:flex;flex-direction:column;gap:8px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.term summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 0;font-weight:800}
.term summary::-webkit-details-marker{display:none}
.term summary small{margin-left:auto;font-weight:600;color:var(--muted);font-size:12.5px}
.term p{margin:0 0 14px;color:var(--muted);font-size:15px}
.term.lock{opacity:.55}
.term.lock summary{cursor:default}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button,.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:0;border-radius:12px;background:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs [aria-current]{color:var(--ink);background:var(--band)}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhd{display:flex;align-items:center;gap:14px;height:60px}
.lx{flex:none;width:40px;height:40px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lx svg{width:24px;height:24px}
.lbar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--good);border-radius:inherit;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lbody .wrap{padding-block:12px 24px}
.kind{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.lbody h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.2;margin:0 0 14px;text-wrap:balance}
.teach p{margin:0 0 12px;font-size:17px;line-height:1.55}
.teach .ex{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 16px;margin:16px 0;font-size:15.5px}
.teach .ex b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.teach .you{border-left-color:var(--good)}
.teach .you b{color:var(--good)}
.teach .say{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.45;color:var(--ink);border-left:3px solid var(--gold);padding-left:14px;margin:18px 0}
.teach .say small{display:block;font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.newterm svg,.term summary svg{width:15px;height:15px;flex:none}
.newterm{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--good);background:var(--good-soft);padding:4px 10px;border-radius:999px;margin:0 6px 8px 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);cursor:pointer;font-size:16px;font-weight:600;line-height:1.35}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--band)}
.opt[aria-pressed="true"] .k{border-color:var(--accent);color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;font-weight:800}
.numq{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 16px;height:64px;font-size:24px;font-weight:800}
.numq:focus-within{border-color:var(--accent)}
.numq input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.numq span{color:var(--muted)}
.numq.ok{border-color:var(--good);background:var(--good-soft)}
.numq.no{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{min-height:64px;font-size:14.5px;padding:10px 12px}
.match .col:first-child .opt{font-weight:800;justify-content:center;text-align:center}
.match .opt.gone{opacity:.35;border-color:var(--good);background:var(--good-soft)}
.match .opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lft{border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.lft .wrap{padding-block:14px}
.fb{display:none;margin-bottom:12px}
.fb.on{display:block}
.fb h3{margin:0 0 4px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:24px;height:24px}
.fb p{margin:0;font-size:15px}
.lft.ok{background:var(--good-soft);border-top-color:transparent}
.lft.ok .fb h3{color:var(--good)}
.lft.no{background:var(--bad-soft);border-top-color:transparent}
.lft.no .fb h3{color:var(--bad)}
.cta{display:block;width:100%;height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.cta:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.lft.ok .cta{background:var(--good);color:#fff}
.lft.no .cta{background:var(--bad);color:#fff}
.cta.ghost{background:none;color:var(--accent);box-shadow:none;margin-top:6px}
:root[data-theme="dark"] .lft.ok .cta,:root[data-theme="dark"] .lft.no .cta{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lft.ok .cta,:root:not([data-theme="light"]) .lft.no .cta{color:#0B1220}}

/* done screen */
.done{text-align:center;padding-top:24px}
.done .medal{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#fff;box-shadow:0 8px 0 #7B5D2C;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.done .medal svg{width:54px;height:54px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.done h2{font-size:30px;margin-bottom:6px}
.done>p{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px 6px;background:var(--surface)}
.stat span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.g b{color:var(--good)}.stat.o b{color:var(--gold)}
.learned{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.learned b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.learned div{margin-top:8px}
.verse{font-family:var(--display);font-style:italic;font-size:17px;color:var(--ink);margin:0 0 12px}
.verse small{display:block;font-family:var(--body);font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px}

/* in-page confirm */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(11,18,32,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 6px;font-size:19px}
.sheet p{margin:0 0 16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div></nav>

  <div class="wrap lhd"><button type="button" class="lx" id="lClose" aria-label="Quit lesson"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="lbar" role="progressbar" aria-label="Lesson progress"><i id="lBar"></i></div></div>

</div>

(function(){
/* ---------- content ---------- */
var STEPS=[
 {n:1,t:'Know your number',d:'Budgets, needs and wants'},

];

var L=[
{id:'tfsa',t:'The TFSA',ic:'shield',terms:['TFSA','Contribution room'],
 teach:[{h:'Your tax-free account',b:'<p>A <b>Tax-Free Savings Account</b> is an investment account. Everything you earn inside it, the payouts and the growth, is never taxed. Not while it’s in there, and not when you take it out.</p><p>For 2026 you get <b>$7,000</b> of new room. Unused room carries forward, every year.</p>'},
        {h:'Room starts when you arrive',b:'<p>Your room starts the year you’re both <b>18 and a resident of Canada</b>. Years before you arrived don’t count, even if you were an adult.</p><div class="ex"><b>Example</b>Amara arrived in 2023 at age 30. Her room: $6,500 for 2023, then $7,000 each for 2024, 2025 and 2026. That’s <b>$27,500</b>, not the $109,000 a person who has been here since 2009 has.</div><p>Take money out, and that amount comes back as new room on <b>January 1 of next year</b>. Put in more than your room and the CRA charges <b>1% a month</b> on the extra.</p>'}],
 qs:[{k:'mc',q:'In a TFSA, which of these is taxed?',o:['The payouts','The growth','Both','Neither'],a:3,w:'Nothing earned inside a TFSA is taxed, even when you withdraw it.'},
     {k:'num',q:'Kwame became a resident in 2024 at age 25 and has never contributed. How much TFSA room does he have in 2026?',pre:'$',a:21000,tol:0,w:'$7,000 for each of 2024, 2025 and 2026: $21,000. Years before he arrived don’t count.'},
     {k:'tf',q:'You take $5,000 out of your TFSA in March. You can put it back in April without using any new room.',a:false,w:'False. The $5,000 comes back as room on January 1 of next year. Putting it back sooner uses this year’s room, and if you have none, it’s an over-contribution.'},
     {k:'mc',q:'What does the CRA charge on an over-contribution?',o:['Nothing, they return it','1% a month on the extra','A flat $100','15% of your whole account'],a:1,w:'1% of the extra amount, for every month it stays in.'}]},
{id:'rrsp',t:'The RRSP',ic:'clock',terms:['RRSP','Tax deduction','Earned income'],
 teach:[{h:'Tax break now, tax later',b:'<p>A <b>Registered Retirement Savings Plan</b> works the other way. What you put in is a <b>tax deduction</b>: it lowers your taxable income this year, so you often get a refund.</p><p>Inside, it grows without tax. When you take money out, it’s taxed as income that year.</p>'},
        {h:'Your room comes from your pay',b:'<p>Each year you get <b>18% of last year’s earned income</b> in Canada, up to <b>$33,810</b> for 2026, minus any workplace pension adjustment. Unused room carries forward.</p><div class="ex"><b>For newcomers</b>Your first year here usually has no RRSP room. Your Canadian pay this year creates room for next year, once you file your tax return.</div><p>One more reason income investors like it: U.S.-listed funds pay <b>no U.S. tax</b> on payouts inside an RRSP.</p>'}],
 qs:[{k:'mc',q:'What happens when you withdraw from an RRSP?',o:['Nothing, it’s tax-free','It’s taxed as income that year','You pay a 1% penalty','It goes back into your TFSA'],a:1,w:'RRSP withdrawals are added to your income and taxed that year.'},
     {k:'num',q:'Tolu earned $80,000 in 2025 and has no workplace pension. How much new RRSP room does that give her for 2026?',pre:'$',a:14400,tol:0,w:'18% of $80,000 is $14,400, well under the $33,810 cap.'},
     {k:'tf',q:'Putting money into an RRSP can lower the tax you pay this year.',a:true,w:'True. Contributions are a deduction from your taxable income.'},
     {k:'mc',q:'Femi starts his first job in Canada in January 2026. When does that job start giving him RRSP room?',o:['Right away, in 2026','For 2027, after he files his 2026 return','Only after 5 years','Never, newcomers can’t have one'],a:1,w:'RRSP room is based on last year’s earned income, so 2026 pay creates 2027 room.'}]},
{id:'acct',t:'Which account first',ic:'layers',terms:['FHSA','Non-registered account','U.S. withholding tax'],
 teach:[{h:'Four accounts, four jobs',b:'<p><b>TFSA:</b> payouts are never taxed and you can take money out any time. Many income investors start here.</p><p><b>RRSP:</b> a deduction now, taxed later. Worth more the higher your income.</p><p><b>FHSA:</b> First Home Savings Account. $8,000 a year, $40,000 in total. A deduction going in, and tax-free coming out for your first home.</p><p><b>Non-registered:</b> no limits, but payouts are taxed every year.</p>'},
        {h:'The U.S. keeps 15%',b:'<p>When a fund listed in the <b>U.S.</b> pays you, the U.S. usually keeps <b>15%</b> first. That’s called <b>withholding tax</b>.</p><div class="ex"><b>By account</b>RRSP: none is kept. TFSA: 15% is kept and you can’t get it back. Non-registered: 15% is kept, and you can usually claim it as a foreign tax credit.</div><p>Canadian-listed funds that hold U.S. stocks still lose some withholding inside the fund, but you don’t see it on your statement.</p>'}],
 qs:[{k:'match',q:'Match each account to what it does',p:[['TFSA','Never taxed, take out any time'],['RRSP','Deduction now, taxed when you withdraw'],['FHSA','For your first home, $40,000 in total'],['Non-registered','No limit, payouts taxed every year']],w:'Each account has a job. Most people use more than one.'},
     {k:'mc',q:'In which account do U.S.-listed funds pay no U.S. withholding tax?',o:['TFSA','RRSP','FHSA','Non-registered'],a:1,w:'The tax treaty exempts retirement accounts like the RRSP. The TFSA isn’t covered.'},
     {k:'tf',q:'In a non-registered account, your payouts are taxed every year.',a:true,w:'True. Only registered accounts shelter them.'}]},
{id:'etf',t:'What an ETF is',ic:'basket',terms:['ETF','Unit'],
 teach:[{h:'A basket you buy in one click',b:'<p>An <b>Exchange-Traded Fund</b> holds many investments at once: dozens of stocks, for example. You buy it on the stock exchange like a single stock.</p><p>What you own are <b>units</b> of the fund. Each unit has a price that moves during the day.</p><div class="ex"><b>Example</b>A Canadian bank ETF might hold the six big banks. One unit at $16 gives you a small piece of all six.</div><p>A company like BMO, Hamilton or Global X runs the fund and charges a yearly fee for it.</p>'}],
 qs:[{k:'mc',q:'What do you own when you buy an ETF?',o:['Shares of the company that runs it','Units of the fund','A loan to the bank','One stock it picks'],a:1,w:'You own units, each a slice of everything the fund holds.'},
     {k:'tf',q:'You can buy and sell ETF units in your brokerage account while the market is open.',a:true,w:'True. That’s the “exchange-traded” part.'},
     {k:'mc',q:'An ETF holding the six big Canadian banks is trading at $16. What does one unit give you?',o:['One share of one bank','A small piece of all six','A $16 savings deposit','Nothing until it pays out'],a:1,w:'One unit holds a small piece of every bank in the fund.'}]},
{id:'yield',t:'Yield',ic:'percent',terms:['Yield','Payout'],
 teach:[{h:'How much it pays you',b:'<p>A fund’s <b>yield</b> is what it pays in a year, divided by its price.</p><div class="ex"><b>Example</b>A fund pays <b>$0.15</b> a month and trades at <b>$15</b>. That’s $1.80 a year. $1.80 ÷ $15 = <b>12%</b>.</div><p>Yield moves with the price. If the price falls and the payout stays the same, the yield goes <b>up</b>. That’s why a very high yield can be a warning, not a gift.</p>'}],
 qs:[{k:'num',q:'A fund pays $0.10 a month and trades at $12. What is its yield?',suf:'%',a:10,tol:0.05,w:'$0.10 × 12 = $1.20 a year. $1.20 ÷ $12 = 10%.'},
     {k:'mc',q:'A fund’s price falls from $20 to $16. The payout doesn’t change. Its yield…',o:['goes up','goes down','stays the same'],a:0,w:'Same payout on a lower price means a higher yield.'},
     {k:'num',q:'You have $50,000 in funds yielding 9%. About how much do they pay you a month?',pre:'$',a:375,tol:1,w:'$50,000 × 9% = $4,500 a year, or $375 a month.'}]},
{id:'tr',t:'Total return',ic:'chart',terms:['Total return'],
 teach:[{h:'Yield isn’t profit',b:'<p><b>Total return</b> is what you really made: the change in the price <b>plus</b> the payouts.</p><div class="ex"><b>Example</b>A fund pays 12% this year, but its price falls 8%. You made about <b>4%</b>, not 12%.</div><p>Compare funds by total return over several years, not by yield alone. A fund that pays 15% while its price keeps sliding is handing you your own money back.</p>'}],
 qs:[{k:'num',q:'You bought a fund at $20. A year later it’s $21 and it paid you $2. What was your total return?',suf:'%',a:15,tol:0.05,w:'$1 price gain + $2 payouts = $3. $3 ÷ $20 = 15%.'},
     {k:'mc',q:'Fund A yields 15% and its price fell 10%. Fund B yields 8% and its price rose 6%. Which did better?',o:['Fund A, about 5%','Fund B, about 14%','They did the same'],a:1,w:'A: 15 − 10 ≈ 5%. B: 8 + 6 ≈ 14%.'},
     {k:'tf',q:'A higher yield always means a better fund.',a:false,w:'False. Check the price over time. Total return is the real test.'}]},
{id:'roc',t:'Return of capital',ic:'return',terms:['Return of capital (ROC)','Adjusted cost base (ACB)','NAV erosion'],
 teach:[{h:'Your own money, handed back',b:'<p>Part of a payout can be labelled <b>return of capital</b>, or ROC. In a non-registered account it isn’t taxed when you get it. Instead, it lowers your <b>adjusted cost base</b> (what you paid, for tax), so you pay more capital gains tax when you sell.</p><p>In a TFSA or RRSP the tax label doesn’t matter.</p>'},
        {h:'When it’s a warning',b:'<p>ROC isn’t always bad. Sometimes it’s just how the fund’s taxes work out.</p><p>The test is the <b>unit price over the years</b>. If it keeps sliding while the fund pays a big yield, the fund is paying out more than it earns. That’s called <b>NAV erosion</b>, and it shrinks your future payouts.</p>'}],
 qs:[{k:'tf',q:'In a non-registered account, return of capital is taxed as income when it’s paid to you.',a:false,w:'False. It lowers your adjusted cost base instead, so the tax comes when you sell.'},
     {k:'mc',q:'What does return of capital do to your adjusted cost base?',o:['Raises it','Lowers it','Nothing'],a:1,w:'It lowers it, which makes your capital gain bigger when you sell.'},
     {k:'mc',q:'Which is the best sign a fund is paying out more than it earns?',o:['Its yield is above 10%','Its unit price keeps falling over the years','It pays monthly','It has a high MER'],a:1,w:'A price that keeps sliding while the payouts continue is NAV erosion.'}]},
{id:'cc',t:'Covered calls',ic:'coin',terms:['Call option','Strike price','Premium','Covered call'],
 teach:[{h:'Getting paid for a promise',b:'<p>A <b>call option</b> gives the buyer the right to buy a stock at a set price, the <b>strike price</b>, before a set date.</p><p>When you own the stock and <b>sell</b> someone that right, it’s a <b>covered call</b>. They pay you a <b>premium</b> today, and it’s yours to keep no matter what.</p>'},
        {h:'You trade some upside for income',b:'<div class="ex"><b>Example</b>You own 100 shares at $50. You sell a call at a $55 strike for $1 a share: <b>$100</b> in your pocket.<br><br>If the stock stays at $50, you keep the $100 and your shares.<br>If it jumps to $60, your shares are sold at $55. You made $5 a share plus the $1, but you miss the move from $55 to $60.</div><p>That’s the deal: income now, in exchange for giving up big gains.</p>'}],
 qs:[{k:'mc',q:'When you sell a covered call, you…',o:['pay a premium','receive a premium','borrow shares','buy more shares'],a:1,w:'The buyer pays you the premium up front.'},
     {k:'num',q:'You own 100 shares and sell one call for $0.80 a share. How much premium do you receive?',pre:'$',a:80,tol:0,w:'One contract covers 100 shares: 100 × $0.80 = $80.'},
     {k:'mc',q:'The stock jumps well past your strike price. What happens?',o:['You lose the premium','Your shares are sold at the strike price','You get the full gain','Nothing, the option expires'],a:1,w:'Your shares are sold at the strike. You keep the premium but miss the gain above it.'},
     {k:'tf',q:'Selling covered calls protects you from a big drop in the stock.',a:false,w:'False. The premium only cushions a small drop. If the stock falls hard, you fall with it.'}]},
{id:'ccetf',t:'Covered-call ETFs',ic:'basket',terms:['Covered-call ETF','Coverage'],
 teach:[{h:'The fund writes the calls for you',b:'<p>A <b>covered-call ETF</b> holds stocks, such as the big banks or U.S. tech, and sells calls on part of them every month. The premiums and dividends come to you as monthly payouts.</p><p>The share it writes calls on is its <b>coverage</b>. Lower coverage keeps more of the upside. Higher coverage pays more now.</p>'},
        {h:'How they behave',b:'<div class="ex"><b>In each market</b>Flat or choppy: they shine, because the premiums keep coming.<br>Strong rally: they lag, because gains above the strike are given up.<br>Crash: they fall nearly as much as the stocks they hold.</div><p>Compare them in the fund directory by yield, fee, size and total return.</p>'}],
 qs:[{k:'mc',q:'In which market do covered-call ETFs do best compared with the stocks they hold?',o:['A strong rally','A flat or choppy market','A crash'],a:1,w:'The premiums keep coming while prices go nowhere.'},
     {k:'mc',q:'One fund writes calls on 30% of its holdings. Another writes on 100%. Which keeps more of the upside?',o:['30% coverage','100% coverage','They’re the same'],a:0,w:'The 70% with no calls written can rise freely.'},
     {k:'tf',q:'In a crash, covered-call ETFs fall much less than the stocks they hold.',a:false,w:'False. They fall only slightly less, by about the premium.'}]},
{id:'mer',t:'Fees: the MER',ic:'tag',terms:['MER'],
 teach:[{h:'The fee you never see',b:'<p>The <b>management expense ratio</b> is the yearly cost of running a fund, as a percentage of your money. You never get a bill: it’s taken inside the fund, so the price and payouts you see are already after it.</p><div class="ex"><b>Example</b>0.65% on $100,000 is <b>$650</b> a year.</div><p>Between two similar funds, the lower MER keeps more for you, every year.</p>'}],
 qs:[{k:'num',q:'You have $40,000 in a fund with a 0.75% MER. About how much does it cost you a year?',pre:'$',a:300,tol:0,w:'$40,000 × 0.75% = $300.'},
     {k:'tf',q:'The MER is charged to your account as a separate fee each year.',a:false,w:'False. It’s taken inside the fund, so you never see a separate charge.'},
     {k:'mc',q:'Two funds hold the same stocks and pay the same. One has a 0.35% MER, the other 0.85%. Over the years…',o:['the 0.35% fund keeps more for you','they end up the same','the 0.85% fund grows faster'],a:0,w:'The difference in fees compounds every year.'}]},
{id:'lev',t:'Leverage and margin',ic:'warn',terms:['Leverage','Margin loan','Margin call'],
 teach:[{h:'Borrowing to invest more',b:'<p>Some funds use <b>leverage</b>: they borrow to hold more than your money buys. At <b>1.25×</b>, every $100 you invest holds $125 of stocks.</p><p>It raises the payout, and it raises the fall. If the holdings drop 20%, the fund drops about <b>25%</b>, plus the cost of borrowing.</p>'},
        {h:'Margin is borrowing yourself',b:'<p>A <b>margin loan</b> is your broker lending you money against your investments. If prices fall, the broker can make a <b>margin call</b>: add cash, or they sell your units, often at the worst time.</p><p class="say">I would avoid margin loans completely. If you must, don’t borrow more than 15%, and let your yield pay it down.<small>Obi Oji</small></p>'}],
 qs:[{k:'mc',q:'A fund is 1.25× leveraged. What does that mean?',o:['It holds $125 for every $100 you invest','It pays 25% more every month','It charges a 1.25% fee','It can’t fall more than 25%'],a:0,w:'It borrows so that $100 of your money holds $125.'},
     {k:'num',q:'A 1.25× fund’s holdings fall 20%. About how much does the fund fall?',suf:'%',a:25,tol:0.5,w:'20% × 1.25 = 25%, before borrowing costs.'},
     {k:'mc',q:'What is a margin call?',o:['A bonus from your broker','Your broker asking you to add cash or sell','A call option you buy','A tax form'],a:1,w:'When your loan gets too big against your investments, the broker asks for cash or sells.'}]},
{id:'drip',t:'Reinvest everything',ic:'loop',terms:['Reinvesting','DRIP','Compounding'],
 teach:[{h:'How income investors grow',b:'<p>With income investing, you grow by <b>reinvesting every payout</b>. Each payout buys more units, and those units pay you next month too. That snowball is <b>compounding</b>.</p><div class="ex"><b>Example</b>$20,000 at a 10% yield, every payout reinvested, price flat. After a year you hold about <b>$22,094</b>, paying about $184 a month instead of $167.</div>'},
        {h:'Let it run automatically',b:'<p>A <b>DRIP</b>, a dividend reinvestment plan, buys more units with each payout for you. Many brokers only buy whole units, so a little cash can be left over.</p><p>Keep one month of your budget in cash as your emergency fund. Everything else goes to work. <b>The yield is your cushion.</b></p>'}],
 qs:[{k:'mc',q:'In income investing, what grows your income fastest?',o:['Spending the payouts','Reinvesting every payout','Keeping cash on the side','Switching funds often'],a:1,w:'Each reinvested payout buys units that pay you too.'},
     {k:'num',q:'You hold $30,000 in a fund that pays 1% a month. You reinvest the first payout. What is the next month’s payout?',pre:'$',a:303,tol:0.5,w:'First payout $300 makes it $30,300. 1% of $30,300 is $303.'},
     {k:'tf',q:'Every broker’s DRIP buys fractions of a unit.',a:false,w:'False. Many only buy whole units and leave the rest in cash.'}]},
{id:'free',t:'Your freedom number',ic:'flag',terms:['Freedom number'],me:1,
 teach:[{h:'The number that ends the job',b:'<p>Your <b>freedom number</b> is how much you need invested for the payouts to cover your month.</p><div class="ex"><b>The formula</b>Monthly need × 12 ÷ yield.<br>$6,000 a month at a 10% yield: $72,000 ÷ 10% = <b>$720,000</b>.</div><p>A higher yield means a smaller number, but only if the fund can keep paying it. That’s why total return matters.</p>'}],
 qs:[{k:'num',q:'Your household needs $4,000 a month. Your funds yield 8%. What is your freedom number?',pre:'$',a:600000,tol:1000,w:'$4,000 × 12 = $48,000. $48,000 ÷ 8% = $600,000.'},
     {k:'mc',q:'If your funds’ yield goes from 8% to 10%, your freedom number…',o:['gets bigger','gets smaller','stays the same'],a:1,w:'Each dollar invested pays more, so you need fewer of them.'}]}
];

var DEF={'TFSA':'Tax-Free Savings Account. Payouts and growth are never taxed. $7,000 of new room for 2026.','Contribution room':'How much you’re allowed to put into a registered account. Unused room carries forward.','RRSP':'Registered Retirement Savings Plan. Contributions are a deduction; withdrawals are taxed as income.','Tax deduction':'An amount that lowers your taxable income, so you pay less tax.','Earned income':'Income from work, mainly your pay. RRSP room is 18% of last year’s, up to the yearly cap.','FHSA':'First Home Savings Account. $8,000 a year, $40,000 in total, deductible going in and tax-free for a first home.','Non-registered account':'A regular investment account with no limits. Payouts and gains are taxed.','U.S. withholding tax':'The 15% the U.S. usually keeps from payouts of U.S.-listed funds. None in an RRSP.','ETF':'Exchange-Traded Fund. A basket of investments you buy on the stock exchange like a stock.','Unit':'One piece of a fund. You own units, and each pays its share of the payouts.','Yield':'A year of payouts divided by the price. $1.80 a year on a $15 unit is 12%.','Payout':'The cash a fund pays you, often monthly. Also called a distribution.','Total return':'Price change plus payouts. What you really made.','Return of capital (ROC)':'Part of a payout that hands back your own money. It lowers your adjusted cost base.','Adjusted cost base (ACB)':'What you paid for an investment, for tax. Your capital gain is the sale price minus this.','NAV erosion':'A fund’s unit price sliding over the years because it pays out more than it earns.','Call option':'The right to buy a stock at a set price before a set date.','Strike price':'The set price in an option contract.','Premium':'What the buyer of an option pays the seller, up front.','Covered call':'Selling a call option on a stock you own, for income now.','Covered-call ETF':'A fund that holds stocks and sells calls on them, paying you the premiums monthly.','Coverage':'The share of a fund’s holdings it writes calls on. Lower coverage keeps more upside.','MER':'Management expense ratio. The yearly cost of a fund, taken inside it.','Leverage':'Borrowing to invest more. 1.25× means $125 held for every $100.','Margin loan':'Your broker lending you money against your investments.','Margin call':'Your broker asking you to add cash or sell when a margin loan gets too big.','Reinvesting':'Using payouts to buy more units instead of spending them.','DRIP':'Dividend reinvestment plan. Buys more units with each payout automatically.','Compounding':'Earning payouts on your past payouts. The snowball that grows your income.','Freedom number':'Monthly need × 12 ÷ yield. What you need invested for payouts to cover your month.'};

function svg(k,f){return '<svg viewBox="0 0 24 24" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[k]+'</svg>'}

var KEY='melius-learn-v1',S={done:{},xp:0,days:[],goal:1};
try{var s0=JSON.parse(localStorage.getItem(KEY)||'null');if(s0&&s0.done)S=Object.assign(S,s0)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function streak(){var set={};S.days.forEach(function(d){set[d]=1});var d=new Date(),n=0;if(!set[dk(d)])d.setDate(d.getDate()-1);while(set[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
function todayCount(){var t=dk(),c=0;Object.keys(S.done).forEach(function(k){(S.done[k].log||[]).forEach(function(d){if(d===t)c++})});return c}
function verses(){try{return localStorage.getItem('melius-verses')==='on'}catch(e){return false}}
function app(){try{var o=JSON.parse(localStorage.getItem('melius-payday-v1')||'null');return o&&!o.example?o:null}catch(e){return null}}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function personal(les){var A=app(),g=A&&A.goal,teach=les.teach.slice(),qs=les.qs.slice();
  if(les.id==='tfsa'&&A&&A.debts){var hi=A.debts.filter(function(d){return +d.b>0&&+d.r>=7});
    if(hi.length)teach.push({h:'Before you invest',b:'<div class="ex you"><b>From your budget</b>You have '+hi.length+' debt'+(hi.length>1?'s':'')+' at 7% or more, like your '+esc(hi[0].n||'debt')+' at '+(+hi[0].r)+'%. That’s Step 3: clear '+(hi.length>1?'them':'it')+' first, then every freedom dollar goes into these accounts.</div><p>Paying off '+(+hi[0].r)+'% debt is a guaranteed '+(+hi[0].r)+'% return. No fund promises that.</p>'})}
  if(les.me&&g&&+g.need>0&&+g.rate>0){var need=+g.need,y=+g.rate,fn=need*12/(y/100),inv=+g.invested||0;
    teach.push({h:'Yours, from Melius Money',b:'<div class="ex you"><b>Your plan</b>You need <b>'+$m(need)+'</b> a month. At a '+y+'% yield, your freedom number is <b>'+$m(fn)+'</b>.'+(inv>0?' You have '+$m(inv)+' invested: <b>'+Math.min(100,Math.round(inv/fn*100))+'%</b> of the way.':'')+'</div>'});
    qs.push({k:'num',q:'Your plan in Melius Money needs '+$m(need)+' a month. At a '+y+'% yield, what is your freedom number?',pre:'$',a:Math.round(fn),tol:Math.max(100,fn*0.01),w:$m(need)+' × 12 ÷ '+y+'% = '+$m(fn)+'.'})}
  else if(les.me)teach.push({h:'Find yours',b:'<p>Add your monthly need and your investments in <a href="/app/#goals">Melius Money</a>, and this lesson will use your own numbers next time.</p>'});
  return {teach:teach,qs:qs}}

/* ---------- path ---------- */
function curIdx(){for(var i=0;i<L.length;i++)if(!S.done[L[i].id])return i;return -1}
function paint(){var st=streak(),tc=todayCount();
  $('streak').querySelector('span').textContent=st;$('streak').classList.toggle('off',!tc);$('streak').title=st+' day streak'+(tc?'':' (do a lesson today to keep it)');
  $('xp').querySelector('span').textContent=S.xp;
  var c=curIdx(),pct=Math.min(1,tc/S.goal),C=2*Math.PI*30,nd=Object.keys(S.done).length;
  $('today').innerHTML='<div class="ring" aria-label="Today: '+tc+' of '+S.goal+' lesson'+(S.goal>1?'s':'')+'"><svg viewBox="0 0 72 72"><circle class="bgc" cx="36" cy="36" r="30"/><circle class="fgc" cx="36" cy="36" r="30" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg><span>'+tc+'/'+S.goal+'</span></div>'+
    '<div><h1>'+(tc>=S.goal?(st>1?st+' days in a row. Well done.':'Today’s lesson is done.'):st?'Keep your '+st+'-day streak going':'Two minutes a day')+'</h1><p>'+nd+' of '+L.length+' lessons in Step 4 · '+Object.keys(learnedTerms()).length+' terms learned</p></div>'+
    (c>-1?'<button type="button" class="go" data-go="'+c+'">'+(tc>=S.goal?'Keep going: ':'Start: ')+esc(L[c].t)+' →</button>':'<button type="button" class="go" data-go="r">Practise a random lesson →</button>');
  var xs=[0,-46,-70,-46,0,46,70,46];
  var u=STEPS.filter(function(x){return x.live})[0];
  $('units').innerHTML='<section class="unit live"><div class="unit-hd"><span class="n">'+u.n+'</span><div><h2>Step '+u.n+': '+u.t+'</h2><p>'+u.d+'</p></div></div><ol class="path">'+L.map(function(l,i){var cls=S.done[l.id]?'done':i===c?'cur':'lock';
      return '<li class="node '+cls+'" style="--x:'+xs[i%8]+'px"><button type="button" data-go="'+i+'" aria-label="'+esc(l.t)+(cls==='done'?', done':cls==='lock'?', locked':', start')+'">'+(i===c?'<span class="start">Start</span>':'')+svg(cls==='done'?'check':cls==='lock'?'lock':l.ic)+'</button><span class="lbl">'+esc(l.t)+'</span></li>'}).join('')+'</ol></section>'+
    '<h2 class="soon-h">Coming soon</h2><ul class="soon-l">'+STEPS.filter(function(x){return !x.live}).map(function(x){return '<li><span class="n">'+x.n+'</span><span><b>'+x.t+'</b> · '+x.d+'</span></li>'}).join('')+'</ul>';
}
function learnedTerms(){var o={};L.forEach(function(l){if(S.done[l.id])l.terms.forEach(function(t){o[t]=l.t})});return o}
function terms(){var o=learnedTerms(),all=[];L.forEach(function(l){l.terms.forEach(function(t){all.push([t,l.t])})});
  var n=Object.keys(o).length;$('tCount').textContent=n?n+' of '+all.length+' terms learned. Tap one to review it.':'Finish lessons to collect the terms you learn.';
  $('tList').innerHTML=all.map(function(x){var on=!!o[x[0]];return on?'<details class="term"><summary>'+esc(x[0])+'<small>'+esc(x[1])+'</small></summary><p>'+esc(DEF[x[0]]||'')+'</p></details>':'<div class="term lock"><summary>'+svg('lock')+' <span>'+esc(x[0])+'</span><small>'+esc(x[1])+'</small></summary></div>'}).join('')}
function view(v){$('vPath').hidden=v!=='path';$('vTerms').hidden=v!=='terms';document.querySelectorAll('.tabs [data-v]').forEach(function(b){if(b.dataset.v===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(v==='terms')terms();scrollTo(0,0)}
document.querySelectorAll('.tabs [data-v]').forEach(function(b){b.addEventListener('click',function(){view(b.dataset.v)})});

function confirmSheet(title,body,yes,cb){var d=document.createElement('div');d.className='sheet';d.innerHTML='<div class="card" role="dialog" aria-modal="true"><h3>'+title+'</h3><p>'+body+'</p><button type="button" class="cta" data-y>'+yes+'</button><button type="button" class="cta ghost" data-n>Not now</button></div>';
  document.body.appendChild(d);d.addEventListener('click',function(e){if(e.target===d||e.target.closest('[data-n]'))d.remove();else if(e.target.closest('[data-y]')){d.remove();cb()}});d.querySelector('[data-y]').focus()}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(!b||!$('lesson').hidden)return;var g=b.dataset.go;
  if(g==='r'){start(Math.floor(Math.random()*L.length));return}
  var i=+g,c=curIdx();if(c>-1&&i>c&&!S.done[L[i].id]){confirmSheet('Jump ahead?','“'+L[i].t+'” comes after “'+L[c].t+'”. You can start it now, but the earlier lessons build up to it.','Start anyway',function(){start(i)});return}
  start(i)});

/* ---------- lesson engine ---------- */
var R=null;
function start(i){var les=L[i],p=personal(les);
  R={i:i,les:les,steps:p.teach.map(function(t){return {k:'teach',t:t}}).concat(p.qs.map(function(q){return {k:'q',q:q}})),pos:0,total:0,miss:0,first:{},retry:[],state:'ask'};
  R.total=R.steps.length;$('lesson').hidden=false;document.body.style.overflow='hidden';show()}
function close(){$('lesson').hidden=true;document.body.style.overflow='';R=null;paint()}
$('lClose').addEventListener('click',function(){if(!R)return;if(R.state==='fin'||R.pos===0){close();return}confirmSheet('Quit this lesson?','Your progress in this lesson won’t be saved.','Quit',close)});
function bar(){$('lBar').style.width=(R.state==='fin'?100:Math.min(100,R.pos/R.steps.length*100))+'%'}
function ft(cls,fb,label,dis){var f=$('lFt');f.className='lft'+(cls?' '+cls:'');$('fb').className='fb'+(fb?' on':'');$('fb').innerHTML=fb||'';$('lGo').textContent=label;$('lGo').disabled=!!dis}
function show(){var st=R.steps[R.pos],h='';R.state='ask';R.pick=null;bar();$('lBody').scrollTop=0;
  if(st.k==='teach'){h='<p class="kind">'+esc(R.les.t)+'</p><div class="teach"><h2 id="lTitle">'+st.t.h+'</h2>'+st.t.b+'</div>';$('lIn').innerHTML=h;ft('','', 'Continue');R.state='teach';return}
  var q=st.q,id='q'+R.pos;h='<p class="kind">'+(st.retry?'Try again':{mc:'Choose the answer',tf:'True or false?',num:'Work it out',match:'Match the pairs'}[q.k])+'</p><h2 id="lTitle">'+esc(q.q)+'</h2>';
  if(q.k==='mc')h+='<div class="opts" role="group">'+q.o.map(function(o,j){return '<button type="button" class="opt" data-o="'+j+'" aria-pressed="false"><span class="k">'+(j+1)+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
  if(q.k==='tf')h+='<div class="opts tf" role="group"><button type="button" class="opt" data-o="1" aria-pressed="false">True</button><button type="button" class="opt" data-o="0" aria-pressed="false">False</button></div>';
  if(q.k==='num')h+='<label class="numq" id="nq">'+(q.pre?'<span>'+q.pre+'</span>':'')+'<input id="nIn" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Your answer">'+(q.suf?'<span>'+q.suf+'</span>':'')+'</label><p class="hint">Round to the nearest whole number.</p>';
  if(q.k==='match'){var L2=q.p.map(function(x,j){return j}),R2=L2.slice().sort(function(){return Math.random()-.5});
    h+='<div class="match"><div class="col">'+L2.map(function(j){return '<button type="button" class="opt" data-l="'+j+'" aria-pressed="false">'+esc(q.p[j][0])+'</button>'}).join('')+'</div><div class="col">'+R2.map(function(j){return '<button type="button" class="opt" data-r="'+j+'" aria-pressed="false">'+esc(q.p[j][1])+'</button>'}).join('')+'</div></div>';R.m={l:null,r:null,left:q.p.length,bad:0}}
  $('lIn').innerHTML=h;ft('','',q.k==='match'?'Match all pairs':'Check',true);
  if(q.k==='num'){var n=$('nIn');n.addEventListener('input',function(){$('lGo').disabled=!n.value.trim()});n.addEventListener('keydown',function(e){if(e.key==='Enter'&&n.value.trim())$('lGo').click()});setTimeout(function(){try{n.focus({preventScroll:true})}catch(x){}},250)}}
$('lIn').addEventListener('click',function(e){if(!R||R.state!=='ask')return;var q=R.steps[R.pos].q;
  var o=e.target.closest('[data-o]');if(o&&(q.k==='mc'||q.k==='tf')){$('lIn').querySelectorAll('[data-o]').forEach(function(b){b.setAttribute('aria-pressed',String(b===o))});R.pick=+o.dataset.o;$('lGo').disabled=false;return}
  if(q.k!=='match')return;var l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]'),b=l||r;if(!b||b.disabled)return;
  var side=l?'l':'r';$('lIn').querySelectorAll('[data-'+side+']').forEach(function(x){if(!x.disabled)x.setAttribute('aria-pressed',String(x===b))});R.m[side]=+b.dataset[side];
  if(R.m.l!=null&&R.m.r!=null){var bl=$('lIn').querySelector('[data-l="'+R.m.l+'"]'),br=$('lIn').querySelector('[data-r="'+R.m.r+'"]');
    if(R.m.l===R.m.r){[bl,br].forEach(function(x){x.classList.add('gone');x.disabled=true;x.setAttribute('aria-pressed','false')});R.m.left--;buzz(15)}
    else{R.m.bad++;[bl,br].forEach(function(x){x.classList.add('no','shake');setTimeout(function(){x.classList.remove('no','shake');x.setAttribute('aria-pressed','false')},450)});buzz([30,40,30])}
    R.m.l=R.m.r=null;if(!R.m.left)grade(R.m.bad===0)}});
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function parseNum(s){s=String(s).replace(/[,$%\s]/g,'');var k=/k$/i.test(s);s=s.replace(/k$/i,'');var v=parseFloat(s);return isNaN(v)?null:k?v*1000:v}
function grade(ok){var st=R.steps[R.pos],q=st.q;R.state='graded';
  if(q.k==='mc'||q.k==='tf'){var ans=q.k==='tf'?(q.a?1:0):q.a;$('lIn').querySelectorAll('[data-o]').forEach(function(b){b.disabled=true;var v=+b.dataset.o;if(v===ans)b.classList.add('ok');else if(v===R.pick)b.classList.add('no')})}
  if(q.k==='num'){$('nIn').readOnly=true;$('nq').classList.add(ok?'ok':'no')}
  if(!st.retry&&!R.first[R.pos])R.first[R.pos]=ok?'ok':'no';
  if(!ok){R.miss++;R.retry.push({k:'q',q:q,retry:1})}
  var right=q.k==='num'?'Answer: '+(q.pre||'')+Math.round(q.a).toLocaleString('en-CA')+(q.suf||'')+'. ':'';
  ft(ok?'ok':'no','<h3>'+svg(ok?'check':'warn')+(ok?['Nicely done','Correct','You got it','Exactly'][Math.floor(Math.random()*4)]:'Not quite')+'</h3><p>'+(ok?'':esc(right))+esc(q.w)+(ok||st.retry?'':' You’ll see this one again.')+'</p>','Continue');buzz(ok?20:[40,50,40]);$('lGo').focus()}
$('lGo').addEventListener('click',function(){if(!R)return;
  if(R.state==='fin'){close();return}
  if(R.state==='teach'||R.state==='graded'){R.pos++;if(R.pos>=R.steps.length&&R.retry.length){R.steps=R.steps.concat(R.retry);R.retry=[]}if(R.pos>=R.steps.length){finish();return}show();return}
  var q=R.steps[R.pos].q;
  if(q.k==='mc')grade(R.pick===q.a);
  else if(q.k==='tf')grade((R.pick===1)===q.a);
  else if(q.k==='num'){var v=parseNum($('nIn').value);grade(v!=null&&Math.abs(v-q.a)<=(q.tol||0)+1e-9)}});
document.addEventListener('keydown',function(e){if(!R||R.state!=='ask')return;var q=R.steps[R.pos].q;if(!q)return;if(q.k==='mc'&&/^[1-9]$/.test(e.key)){var b=$('lIn').querySelector('[data-o="'+(+e.key-1)+'"]');if(b)b.click()}if(e.key==='Enter'&&!$('lGo').disabled&&q.k!=='num')$('lGo').click()});
function finish(){var les=R.les,qn=0,ok=0;Object.keys(R.first).forEach(function(k){qn++;if(R.first[k]==='ok')ok++});
  var acc=qn?Math.round(ok/qn*100):100,first=!S.done[les.id],xp=10+(acc===100?5:0),t=dk();
  var rec=S.done[les.id]||{best:0,log:[]};rec.best=Math.max(rec.best,acc);rec.log=(rec.log||[]).concat(t).slice(-30);S.done[les.id]=rec;S.xp+=xp;if(S.days.indexOf(t)<0)S.days.push(t);S.days=S.days.slice(-400);save();
  R.state='fin';bar();var st=streak(),v=verses()?VERSES[R.i%VERSES.length]:null,nx=curIdx();
  $('lIn').innerHTML='<div class="done"><div class="medal">'+svg(acc===100?'star':'check',acc===100)+'</div><h2 id="lTitle">'+(acc===100?'Perfect lesson':'Lesson complete')+'</h2><p>'+esc(les.t)+(first?'':' · practised again')+'</p>'+
    '<div class="stats"><div class="stat g"><span>XP</span><b>+'+xp+'</b></div><div class="stat"><span>Accuracy</span><b>'+acc+'%</b></div><div class="stat o"><span>Streak</span><b>'+st+(st===1?' day':' days')+'</b></div></div>'+
    '<div class="learned"><b>'+(first?'New terms':'Terms in this lesson')+'</b><div>'+les.terms.map(function(x){return '<span class="newterm">'+svg('check')+esc(x)+'</span>'}).join('')+'</div></div>'+
    (v?'<p class="verse">“'+esc(v[0])+'”<small>'+v[1]+' · BSB</small></p>':'')+'</div>';
  ft('','',nx>-1?'Continue':'Back to the path');try{gtag('event','learn_done',{lesson:les.id,acc:acc})}catch(x){}}
paint();
})();
</script>
</body>

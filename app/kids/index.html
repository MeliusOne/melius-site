<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Quest</title>
<meta name="description" content="A free money game for kids: learn saving, investing, real estate, Bitcoin, DeFi, AI and how the world works, two minutes a day.">
<meta name="theme-color" content="#FFF6E5">
<link rel="icon" href="../icon-m1-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-m1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{--bg:#FFF6E5;--surface:#FFFFFF;--band:#FFF0D6;--ink:#1E2A44;--muted:#5E6A80;--line:#EADFC8;--brand:#1D3557;--gold:#E0A93B;--gold-d:#B8862A;--good:#2E9B5F;--good-soft:#DFF5E8;--bad:#D2443A;--bad-soft:#FCE4E1;--lock:#CFC6B4;--sky:#DDF1FF;--shadow:0 6px 0 rgba(30,42,68,.08);--display:'Fredoka','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A2B;--surface:#17253B;--band:#1C2D47;--ink:#F1F4FA;--muted:#A9B5CA;--line:#2A3D5C;--brand:#E0A93B;--gold:#F0BC4E;--gold-d:#B8862A;--good:#5FD394;--good-soft:#173A2B;--bad:#F07A70;--bad-soft:#3F1F1D;--lock:#3A4C6A;--sky:#16304D;--shadow:0 6px 0 rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A2B;--surface:#17253B;--band:#1C2D47;--ink:#F1F4FA;--muted:#A9B5CA;--line:#2A3D5C;--brand:#E0A93B;--gold:#F0BC4E;--gold-d:#B8862A;--good:#5FD394;--good-soft:#173A2B;--bad:#F07A70;--bad-soft:#3F1F1D;--lock:#3A4C6A;--sky:#16304D;--shadow:0 6px 0 rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:var(--ink)}
.brand svg{width:36px;height:36px}
.brand b{font-family:var(--display);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:16px;padding:5px 11px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.chip svg{width:20px;height:20px}
.chip.fl{color:#F07A2A}.chip.fl.off{color:var(--muted)}
.chip.cn{color:var(--gold-d)}
main{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
.hello{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.hello .sprout{width:70px;height:80px}
.tree-row{grid-column:1/-1;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:linear-gradient(var(--sky),transparent);border-radius:18px;padding:8px 12px}
.tree-row svg{width:76px;height:76px}
.tree-row b{font-family:var(--display);font-size:18px;display:block}
.tree-row span{display:block;color:var(--muted);font-weight:800;font-size:13.5px;margin-bottom:6px}
.bubble{position:relative;background:var(--band);border-radius:18px;padding:12px 14px;font-weight:800;font-size:16px;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--band);border-left:0}
.tree-card{margin-top:14px;display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:linear-gradient(var(--sky),var(--surface));border:2px solid var(--line);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow)}
.tree-card svg{width:120px;height:120px}
.tree-card h2{margin:0;font-size:21px}
.tree-card p{margin:2px 0 8px;color:var(--muted);font-weight:700;font-size:14.5px}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:inherit;transition:width .6s}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;height:56px;border:0;border-radius:18px;background:var(--gold);color:#1E2A44;font-family:var(--display);font-weight:700;font-size:19px;cursor:pointer;box-shadow:0 5px 0 var(--gold-d)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.guard{margin-top:26px}
.guard-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.guard-h h2{margin:0;font-size:22px}
.guard-h span{color:var(--muted);font-weight:700;font-size:14px}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.world{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:22px;border:0;background:var(--wc);color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:150px;overflow:hidden}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.world svg.wi{width:44px;height:44px}
.world b{font-family:var(--display);font-size:19px;line-height:1.15}
.world small{font-weight:700;font-size:13px;opacity:.92;line-height:1.3}
.world .wp{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
.world .wp i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.world .wp i u{display:block;height:100%;background:#fff;text-decoration:none}
.world.lock{filter:saturate(.6);opacity:.82}
.world .lk{position:absolute;top:12px;right:12px;width:22px;height:22px;opacity:.9}
.world .done{position:absolute;top:10px;right:10px;background:#fff;color:var(--wc);border-radius:99px;font-size:12px;font-weight:900;padding:2px 8px}
/* world view */
.wv-h{border-radius:24px;padding:18px;color:#fff;background:var(--wc);display:flex;gap:14px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.wv-h svg{width:56px;height:56px;flex:none}
.wv-h h1{margin:0;font-size:26px;line-height:1.1}
.wv-h p{margin:4px 0 0;font-weight:700;opacity:.92}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;border:0;background:none;font-weight:900;color:var(--muted);cursor:pointer;padding:6px 0}
.path{list-style:none;margin:10px 0 0;padding:34px 0 10px;display:flex;flex-direction:column;align-items:center;gap:30px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x,0));width:170px}
.node button{position:relative;width:80px;height:76px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--lock);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.15)}
.node button svg{width:34px;height:34px}
.node button:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.node.cur button{background:var(--wc)}
.node.cur button::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--wc);opacity:.35;animation:pulse 1.8s ease-out infinite}
.node.done button{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.2);opacity:0}}
.node .lbl{font-weight:900;text-align:center;font-size:14.5px;line-height:1.25}
.node.lock .lbl{color:var(--muted);font-weight:800}
.node .st{color:var(--gold);font-size:15px;letter-spacing:2px;line-height:1}
.node .start{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--wc);border:3px solid var(--line);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.badge-big{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px}
.badge-big svg{width:56px;height:56px;flex:none}
/* badges & parents */
.sec-h{margin:4px 0 4px;font-size:26px}
.sec-p{margin:0 0 16px;color:var(--muted);font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.bdg svg{width:58px;height:58px}
.bdg b{font-size:13.5px;line-height:1.25}
.bdg small{color:var(--muted);font-weight:700;font-size:12px}
.bdg.off{opacity:.45;filter:grayscale(1)}
.terms{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.term{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 14px}
.term summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:900;display:flex;gap:8px;align-items:center}
.term summary::-webkit-details-marker{display:none}
.term summary small{margin-left:auto;color:var(--muted);font-weight:700}
.term p{margin:0 0 12px;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:19px}
.card p,.card li{color:var(--muted);font-weight:600;margin:0 0 6px}
.card ul{margin:0;padding-left:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.row b{font-weight:800}
.sw{position:relative;width:54px;height:32px;border-radius:99px;border:0;background:var(--lock);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{left:26px}
.btn2{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer}
.btn2.danger{color:var(--bad)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:0;border-radius:14px;background:none;cursor:pointer;font-size:13px;font-weight:900;color:var(--muted)}
.tabs svg{width:26px;height:26px}
.tabs [aria-current]{color:var(--ink);background:var(--band)}
/* lesson */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhd{display:flex;align-items:center;gap:12px;height:62px}
.lx{flex:none;width:42px;height:42px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lx svg{width:26px;height:26px}
.lbar{flex:1;height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--good);border-radius:inherit;transition:width .45s cubic-bezier(.2,.7,.2,1);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lbody .wrap{padding-block:10px 24px}
.kind{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--wcl,var(--gold-d));margin:0 0 8px}
.lbody h2{font-size:26px;line-height:1.2;margin:0 0 14px;text-wrap:balance}
.teach{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.teach .sprout{width:72px;height:84px}
.teach p{margin:0 0 12px;font-size:17.5px;line-height:1.55;font-weight:600}
.teach .ex{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:16.5px;font-weight:700}
.teach .ex b{display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);cursor:pointer;font-size:17px;font-weight:800;line-height:1.3}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:#4C9BE8;background:var(--sky)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:20px}
.numq{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:0 16px;height:68px;font-size:26px;font-weight:900}
.numq:focus-within{border-color:#4C9BE8}
.numq input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.numq span{color:var(--muted);font-size:20px}
.numq.ok{border-color:var(--good);background:var(--good-soft)}
.numq.no{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{min-height:66px;font-size:15px;justify-content:center;text-align:center;padding:10px}
.match .opt.gone{opacity:.4;border-color:var(--good);background:var(--good-soft)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lft{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.lft .wrap{padding-block:14px}
.fb{display:none;margin-bottom:12px}
.fb.on{display:flex;gap:12px;align-items:flex-start}
.fb .sprout{width:52px;height:60px;flex:none}
.fb h3{margin:0 0 2px;font-size:21px}
.fb p{margin:0;font-size:15.5px;font-weight:700}
.lft.ok{background:var(--good-soft);border-top-color:transparent}.lft.ok h3{color:var(--good)}
.lft.no{background:var(--bad-soft);border-top-color:transparent}.lft.no h3{color:var(--bad)}
.cta{display:block;width:100%;height:56px;border:0;border-radius:16px;background:var(--good);color:#fff;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.cta:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.lft.no .cta{background:var(--bad)}
.cta.ghost{background:none;color:var(--muted);box-shadow:none;margin-top:6px;font-size:16px}
.done{text-align:center;padding-top:10px}
.done .sprout{width:130px;height:150px;margin:0 auto;display:block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.done h2{font-size:32px;margin:8px 0 4px}
.done .stars{font-size:44px;letter-spacing:8px;color:var(--gold);line-height:1;margin:6px 0 12px}
.done .stars s{text-decoration:none;opacity:.2}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{border:2px solid var(--line);border-radius:16px;padding:10px 6px;background:var(--surface)}
.stat span{display:block;font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-size:24px;font-family:var(--display)}
.learned{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.learned b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tchip{display:inline-block;margin:8px 6px 0 0;padding:4px 10px;border-radius:99px;background:var(--good-soft);color:var(--good);font-weight:900;font-size:13.5px}
.verse{font-style:italic;font-weight:700;color:var(--gold-d);margin:0 0 10px}
.verse small{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.lvlup{background:var(--gold);color:#1E2A44;border-radius:16px;padding:10px 14px;font-weight:900;margin-bottom:12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(15,26,43,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{width:100%;max-width:620px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 6px;font-size:21px}
.sheet p{margin:0 0 16px;color:var(--muted);font-weight:700}
@media (min-width:700px){.worlds{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:360px){.worlds{grid-template-columns:1fr}.tree-card{grid-template-columns:90px 1fr}.tree-card svg{width:90px;height:90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./" aria-label="Money Quest home"><svg viewBox="0 0 100 115" aria-hidden="true" id="logoSprout"></svg><b>Money Quest</b></a>
  <span class="chip fl" id="streak" title="Day streak"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 8 0 1.4 1 2.5 2.3 2.5 1.6 0 2.4-1.4 2.2-3.2C17.7 11 19 13.4 19 16a7 7 0 0 1-14 0c0-4.6 4.2-7 7-14z"/></svg><span>0</span></span>
  <span class="chip cn" id="coins" title="Coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#E0A93B"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#B8862A" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="9" font-weight="900" fill="#B8862A" font-family="Nunito,sans-serif">$</text></svg><span>0</span></span>
</div></header>
<main class="wrap" id="main"></main>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button type="button" data-v="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <button type="button" data-v="badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/></svg>Badges</button>
  <button type="button" data-v="parents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 20c.3-2.4 1.6-4.5 4-4.5 2 0 3.5 1.8 3.5 4.5"/></svg>Parents</button>
</div></nav>

<script>
var GUARDS=[
 {id:'found',t:'Foundations',d:'How money works, from the very start'},
 {id:'old',t:'The Old Guard',d:'Banks, investing, real estate and the economy'},
 {id:'new',t:'The New Guard',d:'Bitcoin, blockchains and decentralization'},
 {id:'future',t:'The Future Guard',d:'AI and the world you’ll grow up into'}];
var WORLDS=[
 {id:'w1',g:'found',t:'Market Square',d:'What money is and where it comes from',ic:'coin',c:'#E0A93B',L:[
  {id:'m1',t:'What is money?',terms:['Barter','Money'],
   teach:[{h:'Before money, people traded',b:'<p>Long ago, if you had apples and wanted shoes, you had to find a shoemaker who wanted apples. Swapping things like that is called <b>barter</b>.</p><p>It was hard! What if the shoemaker didn’t like apples?</p>'},
          {h:'Money fixed the problem',b:'<p><b>Money</b> is anything people agree has value, so everyone accepts it.</p><div class="ex"><b>Money has 3 jobs</b>1. Buy things.<br>2. Measure what things cost.<br>3. Save value for later.</div><p>Today most money is digital: numbers in a bank account or on a card.</p>'}],
   qs:[{k:'mc',q:'Swapping apples for shoes, with no money, is called…',o:['Banking','Barter','Borrowing'],a:1,w:'Trading one thing for another is barter.'},
       {k:'match',q:'Match each job of money',p:[['Buy things','Pay for a sandwich'],['Measure value','A bike costs $200'],['Save for later','Keep $10 for next month']],w:'Money buys, measures and saves.'},
       {k:'tf',q:'Money only means coins and paper bills.',a:false,w:'False! Most money today is digital, in bank accounts and cards.'}]},
  {id:'m2',t:'Needs and wants',terms:['Need','Want'],
   teach:[{h:'Two kinds of spending',b:'<p>A <b>need</b> is something you must have to live and be safe: food, a home, clothes, medicine.</p><p>A <b>want</b> is something nice to have, but you’d be okay without it: a new game, candy, the latest sneakers.</p><div class="ex"><b>Smart rule</b>Pay for needs first. Then choose your wants carefully.</div>'}],
   qs:[{k:'match',q:'Need or want?',p:[['Water','Need'],['Video game','Want'],['Winter coat','Need'],['Third pair of sneakers','Want']],w:'Needs keep you alive and safe. Wants are extras.'},
       {k:'mc',q:'You have $20. Lunch costs $8 and a toy costs $15. What’s the smart choice?',o:['Buy the toy','Buy lunch first','Buy both on credit'],a:1,w:'Needs come first. Then see what’s left for wants.'},
       {k:'tf',q:'A want is always bad.',a:false,w:'False. Wants are fine! Just plan for them after your needs.'}]},
  {id:'m3',t:'Earning money',terms:['Income','Profit'],
   teach:[{h:'Money comes from value',b:'<p>People pay you when you give them something they value: your time, your skill, or something you made. Money you receive is called <b>income</b>.</p>'},
          {h:'Run a lemonade stand',b:'<div class="ex"><b>Example</b>Each cup costs you $1 to make. You sell it for $3.<br>You sell 10 cups: you take in $30, it cost $10.</div><p>What’s left after costs is <b>profit</b>: $30 − $10 = <b>$20</b>.</p>'}],
   qs:[{k:'num',q:'Cookies cost $2 each to bake. You sell 8 for $5 each. What’s your profit?',pre:'$',a:24,w:'You take in 8 × $5 = $40. Costs are 8 × $2 = $16. Profit: $40 − $16 = $24.'},
       {k:'mc',q:'Which is income?',o:['Money you spend on snacks','Money you’re paid for mowing a lawn','Money you owe a friend'],a:1,w:'Income is money that comes in.'},
       {k:'mc',q:'Why do people pay for something?',o:['Because it’s free','Because it gives them value','Because they have to'],a:1,w:'People pay for value: things that help them, save time or bring joy.'}]}]},
 {id:'w2',g:'found',t:'The Four Jars',d:'Spend, save, give and grow',ic:'jar',c:'#3E9B6E',L:[
  {id:'j1',t:'Four jars',terms:['Budget','Saving'],
   teach:[{h:'Every dollar gets a job',b:'<p>Imagine four jars. Each time you get money, split it up:</p><div class="ex"><b>The four jars</b>🛒 <b>Spend</b>: things you need or want now<br>🐷 <b>Save</b>: for something bigger later<br>🎁 <b>Give</b>: to help others<br>🌱 <b>Grow</b>: money that earns more money</div><p>Planning where money goes is called a <b>budget</b>.</p>'}],
   qs:[{k:'num',q:'You get $20 and split it equally into 4 jars. How much in each?',pre:'$',a:5,w:'$20 ÷ 4 = $5 in each jar.'},
       {k:'match',q:'Match the jar to its job',p:[['Spend','Snacks this week'],['Save','A bike in 3 months'],['Give','Help a friend in need'],['Grow','Money that earns more']],w:'Each jar has a job.'},
       {k:'tf',q:'A budget is a plan for your money before you spend it.',a:true,w:'True! Plan first, then spend.'}]},
  {id:'j2',t:'Saving for a goal',terms:['Goal'],
   teach:[{h:'Big things take small steps',b:'<p>Want something that costs a lot? Make it a <b>goal</b>, then save a little each week.</p><div class="ex"><b>Example</b>A $60 game. Save $10 a week.<br>$60 ÷ $10 = <b>6 weeks</b>.</div><p>Waiting is hard, but you’ll own it without owing anyone.</p>'}],
   qs:[{k:'num',q:'A scooter costs $90. You save $15 a week. How many weeks?',a:6,w:'$90 ÷ $15 = 6 weeks.'},
       {k:'mc',q:'You have $30 saved. Is it smarter to…',o:['Spend it all today','Keep saving toward your goal','Borrow more to buy now'],a:1,w:'Stick to the goal. Future you will thank you.'},
       {k:'tf',q:'Saving a little every week adds up.',a:true,w:'True. Small steps, done often, get you there.'}]},
  {id:'j3',t:'Interest: money that grows',terms:['Interest','Compound interest'],
   teach:[{h:'Your money can earn money',b:'<p>When you keep money in a savings account, the bank pays you a little extra. That extra is called <b>interest</b>.</p><div class="ex"><b>Example</b>$100 at 10% a year earns $10. Now you have $110.</div>'},
          {h:'The snowball',b:'<p>Next year you earn interest on <b>$110</b>, not just $100. Earning interest on your interest is <b>compound interest</b>. It’s like a snowball rolling downhill, getting bigger and bigger.</p>'}],
   qs:[{k:'num',q:'$200 earns 5% interest in a year. How much interest?',pre:'$',a:10,w:'5% of $200 is $10.'},
       {k:'mc',q:'Compound interest means…',o:['Interest only on what you put in','Interest on your interest too','A fee the bank charges'],a:1,w:'You earn interest on past interest. Snowball!'},
       {k:'tf',q:'Starting to save early gives the snowball more time to grow.',a:true,w:'True. Time is the snowball’s best friend.'}]}]},
 {id:'w3',g:'old',t:'The Bank Tower',d:'Banks, borrowing and credit',ic:'bank',c:'#4C6FB5',L:[
  {id:'b1',t:'What banks do',terms:['Bank','Deposit','Loan'],
   teach:[{h:'The old guard of money',b:'<p>A <b>bank</b> keeps your money safe. Money you put in is a <b>deposit</b>.</p><p>Banks lend some of those deposits to other people as <b>loans</b>, and charge them interest. Part of that interest is how the bank pays you, and how it makes a profit.</p><div class="ex"><b>In Canada</b>Eligible deposits at member banks are protected by CDIC, up to $100,000 per category, if a bank fails.</div>'}],
   qs:[{k:'mc',q:'How does a bank make money?',o:['It prints it','It lends deposits and charges interest','It keeps all deposits in a vault forever'],a:1,w:'Banks earn more interest on loans than they pay on deposits.'},
       {k:'match',q:'Match the words',p:[['Deposit','Money you put in'],['Loan','Money you borrow'],['Interest','The price of money over time']],w:'These three words run the banking world.'},
       {k:'tf',q:'When you borrow money, you usually pay back more than you borrowed.',a:true,w:'True. The extra is interest.'}]},
  {id:'b2',t:'Borrowing and debt',terms:['Debt','Credit card'],
   teach:[{h:'Borrowed money isn’t free',b:'<p>Money you owe is called <b>debt</b>. A <b>credit card</b> lets you buy now and pay later. If you don’t pay it all back on time, the card charges high interest, often around 20% a year.</p><div class="ex"><b>Example</b>Borrow $100 at 20% for a year. You owe <b>$120</b>.</div>'}],
   qs:[{k:'num',q:'You borrow $50 at 20% for one year. How much do you owe?',pre:'$',a:60,w:'20% of $50 is $10. $50 + $10 = $60.'},
       {k:'mc',q:'Which costs the most over time?',o:['Paying cash','Paying a card in full each month','Paying only the minimum on a card'],a:2,w:'Minimum payments leave a balance that keeps growing with interest.'},
       {k:'tf',q:'Debt with a high interest rate should be paid off fast.',a:true,w:'True. High-interest debt grows like a weed.'}]},
  {id:'b3',t:'Your credit score',terms:['Credit score'],
   teach:[{h:'Your money report card',b:'<p>A <b>credit score</b> is a number that shows lenders how well you pay back what you borrow. In Canada it runs from about 300 to 900.</p><div class="ex"><b>Keep it strong</b>Pay on time, every time. Don’t borrow more than you need. Check your statements.</div><p>A good score makes it easier to rent a home or get a fair rate on a loan later.</p>'}],
   qs:[{k:'mc',q:'What helps your credit score most?',o:['Paying bills on time','Having lots of cards','Never checking your statements'],a:0,w:'On-time payments matter most.'},
       {k:'tf',q:'A credit score shows how well you pay back money you borrow.',a:true,w:'True. It’s like a report card for borrowing.'},
       {k:'mc',q:'Why does a good credit score help later?',o:['It gives you free money','It makes renting and borrowing easier and cheaper','It lets you skip paying taxes'],a:1,w:'Lenders and landlords trust a good score.'}]}]},
 {id:'w4',g:'old',t:'The Orchard',d:'Investing: owning things that grow',ic:'tree',c:'#2E8B57',L:[
  {id:'o1',t:'Owning a slice',terms:['Stock','Shareholder'],
   teach:[{h:'Own part of a company',b:'<p>A company can be split into tiny pieces called <b>shares</b> or <b>stocks</b>. If you buy one, you own a slice of the company. You’re a <b>shareholder</b>!</p><div class="ex"><b>Example</b>A company has 100 shares. You own 10. You own <b>10%</b> of it.</div><p>If the company grows, your slice can be worth more. If it struggles, it can be worth less.</p>'}],
   qs:[{k:'num',q:'A pizza shop has 200 shares. You own 20. What percent do you own?',suf:'%',a:10,w:'20 ÷ 200 = 10%.'},
       {k:'tf',q:'A stock’s price can go down as well as up.',a:true,w:'True. Investing always has some risk.'},
       {k:'mc',q:'Owning a stock means you…',o:['Lent money to the company','Own a slice of the company','Work for the company'],a:1,w:'A shareholder is a part-owner.'}]},
  {id:'o2',t:'Fruit from your tree',terms:['Dividend','ETF'],
   teach:[{h:'Getting paid to own',b:'<p>Some companies share their profits with owners. That payment is called a <b>dividend</b>. It’s like fruit from a tree you own.</p><p>An <b>ETF</b> is a basket that holds lots of companies at once, so one bad apple doesn’t spoil everything.</p><div class="ex"><b>Don’t put all your eggs in one basket</b>Owning many companies is called diversifying.</div>'}],
   qs:[{k:'mc',q:'A dividend is…',o:['A fee you pay','A share of profits paid to owners','A type of loan'],a:1,w:'Dividends are profits shared with shareholders.'},
       {k:'mc',q:'Why own an ETF instead of one company?',o:['It holds many companies, which spreads the risk','It never goes down','It’s a savings account'],a:0,w:'Many companies in one basket spreads the risk.'},
       {k:'tf',q:'Planting your fruit again, by reinvesting dividends, helps your orchard grow.',a:true,w:'True! That’s how a small orchard becomes a big one.'}]},
  {id:'o3',t:'Getting paid for a promise',terms:['Option','Covered call','Premium'],
   teach:[{h:'Sell a promise, get paid now',b:'<p>Say you own a share at $50. Someone pays you <b>$1</b> today for a promise: if the price climbs above $55, you’ll sell it to them at $55.</p><p>That’s a <b>covered call</b>, a kind of <b>option</b>. The $1 you get is the <b>premium</b>, and it’s yours to keep either way.</p><div class="ex"><b>The trade-off</b>You get paid now, but give up big jumps above $55.</div><p>Some funds do this for you every month and pay you the premiums.</p>'}],
   qs:[{k:'mc',q:'In a covered call, the premium is…',o:['Money you pay','Money you’re paid now for the promise','A tax'],a:1,w:'The buyer pays you the premium up front.'},
       {k:'mc',q:'The stock jumps from $50 to $70. With your $55 promise, you sell at…',o:['$70','$55','$50'],a:1,w:'You promised $55, so you sell at $55 and keep the premium.'},
       {k:'tf',q:'Covered calls trade some big gains for steady income now.',a:true,w:'True. Income now, in exchange for giving up big jumps.'}]},
  {id:'o4',t:'The magic of time',terms:['Rule of 72'],
   teach:[{h:'How fast does money double?',b:'<p>The <b>Rule of 72</b> is a quick trick: divide 72 by the yearly growth rate to see how many years it takes your money to double.</p><div class="ex"><b>Example</b>At 8% a year: 72 ÷ 8 = <b>9 years</b> to double.</div><p>Start at 12 and your money could double several times before you’re 50.</p>'}],
   qs:[{k:'num',q:'At 6% a year, about how many years to double?',a:12,w:'72 ÷ 6 = 12 years.'},
       {k:'num',q:'At 12% a year, about how many years to double?',a:6,w:'72 ÷ 12 = 6 years.'},
       {k:'mc',q:'Who probably ends up with more: someone who starts investing at 15, or at 35?',o:['At 15','At 35','The same'],a:0,w:'Twenty extra years of doubling makes a huge difference.'}]}]},
 {id:'w5',g:'old',t:'Brick Street',d:'Homes, landlords and real estate',ic:'house',c:'#C0623E',L:[
  {id:'r1',t:'Rent or own?',terms:['Rent','Mortgage','Equity'],
   teach:[{h:'Two ways to live somewhere',b:'<p>When you <b>rent</b>, you pay a landlord each month to live in their home.</p><p>To <b>own</b>, most people borrow from a bank with a special loan called a <b>mortgage</b>, and pay it back over many years.</p><div class="ex"><b>Equity</b>The part of the home you truly own is your equity: its value minus what you still owe.</div>'}],
   qs:[{k:'num',q:'A home is worth $500,000. You still owe $300,000. What’s your equity?',pre:'$',a:200000,w:'$500,000 − $300,000 = $200,000.'},
       {k:'mc',q:'A mortgage is…',o:['A loan to buy a home','A type of rent','A home insurance plan'],a:0,w:'A mortgage is a home loan.'},
       {k:'tf',q:'When you rent, your monthly payment builds your own equity.',a:false,w:'False. Rent pays the landlord. Mortgage payments build your equity.'}]},
  {id:'r2',t:'The down payment',terms:['Down payment'],
   teach:[{h:'The first chunk is yours',b:'<p>Banks want you to pay part of the price yourself, up front. That’s the <b>down payment</b>. The bank lends the rest.</p><div class="ex"><b>Example</b>A $400,000 home with 20% down: you pay <b>$80,000</b> and borrow $320,000.</div>'}],
   qs:[{k:'num',q:'A $300,000 condo with 20% down. How much is the down payment?',pre:'$',a:60000,w:'20% of $300,000 is $60,000.'},
       {k:'mc',q:'Why save a bigger down payment?',o:['You borrow less and pay less interest','The house gets bigger','You never pay taxes'],a:0,w:'Less borrowed means less interest.'},
       {k:'tf',q:'The bank lends you the part you don’t pay up front.',a:true,w:'True. That part is your mortgage.'}]},
  {id:'r3',t:'Being a landlord',terms:['Cash flow','REIT'],
   teach:[{h:'A home that pays you',b:'<p>Landlords collect rent. After paying the mortgage and costs like repairs and taxes, what’s left is <b>cash flow</b>.</p><div class="ex"><b>Example</b>Rent: $2,000. Mortgage: $1,200. Other costs: $400.<br>Cash flow: <b>$400</b> a month.</div><p>Can’t buy a building? A <b>REIT</b> lets you own a slice of many buildings, like a stock.</p>'}],
   qs:[{k:'num',q:'Rent is $1,800. Mortgage is $1,100 and costs are $300. What’s the cash flow?',pre:'$',a:400,w:'$1,800 − $1,100 − $300 = $400.'},
       {k:'mc',q:'A REIT lets you…',o:['Own a slice of many buildings','Rent a home for free','Skip a mortgage forever'],a:0,w:'REITs are like stocks for real estate.'},
       {k:'tf',q:'If costs are higher than the rent, cash flow is negative.',a:true,w:'True. Then the landlord pays to own it each month.'}]}]},
 {id:'w6',g:'old',t:'How the World Works',d:'Prices, inflation, banks and governments',ic:'globe',c:'#7A5BB5',L:[
  {id:'e1',t:'Supply and demand',terms:['Supply','Demand'],
   teach:[{h:'Why prices change',b:'<p><b>Supply</b> is how much of something there is. <b>Demand</b> is how many people want it.</p><div class="ex"><b>Concert tickets</b>Few tickets, lots of fans: prices go <b>up</b>.<br>Lots of tickets, few fans: prices go <b>down</b>.</div>'}],
   qs:[{k:'mc',q:'A hot new toy sells out everywhere. What happens to its price?',o:['Goes up','Goes down','Stays the same'],a:0,w:'High demand and low supply push prices up.'},
       {k:'mc',q:'Stores have way too many winter coats in spring. What happens?',o:['Prices rise','Prices fall','Coats disappear'],a:1,w:'Too much supply, too little demand: sale time!'},
       {k:'match',q:'Match the words',p:[['Supply','How much there is'],['Demand','How many want it']],w:'Together they set the price.'}]},
  {id:'e2',t:'Inflation',terms:['Inflation'],
   teach:[{h:'Why candy used to be cheaper',b:'<p><b>Inflation</b> means prices rise over time, so each dollar buys a little less.</p><div class="ex"><b>Example</b>Candy costs $1.00. With 3% inflation, next year it’s about $1.03.</div><p>That’s why money hidden under a mattress slowly loses power, and why people invest.</p>'}],
   qs:[{k:'num',q:'A $2.00 snack with 5% inflation. About how much next year?',pre:'$',a:2.10,tol:0.01,dec:2,w:'5% of $2.00 is $0.10. $2.00 + $0.10 = $2.10.'},
       {k:'tf',q:'With inflation, cash under the mattress buys less over time.',a:true,w:'True. Its buying power shrinks.'},
       {k:'mc',q:'Why do many people invest instead of only saving cash?',o:['To try to grow faster than inflation','Because cash is illegal','To avoid all risk'],a:0,w:'Investing aims to beat inflation over time.'}]},
  {id:'e3',t:'Central banks and taxes',terms:['Central bank','Taxes'],
   teach:[{h:'The referees of money',b:'<p>A <b>central bank</b>, like the Bank of Canada, sets the main interest rate. Higher rates cool down spending and inflation. Lower rates encourage borrowing and spending.</p><p>Governments collect <b>taxes</b> to pay for things we share: roads, schools, hospitals and parks.</p>'}],
   qs:[{k:'mc',q:'Which sets Canada’s main interest rate?',o:['The Bank of Canada','Your corner store','The stock market'],a:0,w:'The Bank of Canada is Canada’s central bank.'},
       {k:'mc',q:'Raising interest rates usually…',o:['Cools down spending and inflation','Makes everything free','Prints more coins'],a:0,w:'Borrowing costs more, so people spend less.'},
       {k:'tf',q:'Taxes help pay for roads, schools and hospitals.',a:true,w:'True. Taxes fund shared services.'}]}]},
 {id:'w7',g:'new',t:'Bitcoin Island',d:'Digital money with no one in charge',ic:'btc',c:'#E8891A',L:[
  {id:'c1',t:'What is Bitcoin?',terms:['Bitcoin','Blockchain'],
   teach:[{h:'Money from the internet',b:'<p><b>Bitcoin</b> is digital money that started in 2009. It was created by someone using the name Satoshi Nakamoto, and no bank or government runs it.</p><p>There will only ever be <b>21 million</b> bitcoins. That limit is written into its rules.</p>'},
          {h:'A notebook everyone shares',b:'<p>Every Bitcoin payment is written in a giant shared notebook called the <b>blockchain</b>. Thousands of computers around the world keep copies and check each other, so no one can secretly change it.</p>'}],
   qs:[{k:'num',q:'What is the most bitcoins that will ever exist, in millions?',suf:'million',a:21,w:'Bitcoin’s rules cap it at 21 million.'},
       {k:'mc',q:'Who controls Bitcoin?',o:['One big bank','The government','No single person: a network of computers following shared rules'],a:2,w:'It’s run by a network, not a company.'},
       {k:'tf',q:'The blockchain is a shared record that many computers keep and check.',a:true,w:'True. That’s what makes it hard to cheat.'}]},
  {id:'c2',t:'Keys and wallets',terms:['Wallet','Private key'],
   teach:[{h:'Your keys, your coins',b:'<p>Bitcoin lives in a digital <b>wallet</b>. What really controls it is a secret code called a <b>private key</b>.</p><div class="ex"><b>Golden rules</b>Never share your private key or recovery words, with anyone. If you lose them, the coins are gone forever. There is no “forgot password” button.</div>'}],
   qs:[{k:'tf',q:'It’s okay to share your private key with a friend you trust.',a:false,w:'False! Anyone with your key can take your coins. Never share it.'},
       {k:'mc',q:'You lose your private key and recovery words. What happens?',o:['The bank resets it','The coins are lost for good','Bitcoin sends a new one'],a:1,w:'No one can recover it. Guard your keys.'},
       {k:'mc',q:'Someone online says “send me your recovery words to verify your wallet.” You…',o:['Send them','Say no, it’s a scam','Send half'],a:1,w:'No real service ever asks for your recovery words.'}]},
  {id:'c3',t:'Ups, downs and scams',terms:['Volatility','Scam'],
   teach:[{h:'A bumpy ride',b:'<p>Bitcoin’s price can jump or drop a lot in a single day. Big swings are called <b>volatility</b>. Some people have made money; many have lost money buying at the wrong time.</p><div class="ex"><b>Spot a scam</b>“Double your money fast!” “Guaranteed profits!” “Act now!” These are red flags. If it sounds too good to be true, it is.</div><p>Kids should never buy crypto without a trusted adult.</p>'}],
   qs:[{k:'mc',q:'A video promises to “double your Bitcoin in 24 hours, guaranteed.” This is…',o:['A great deal','Almost certainly a scam','A bank offer'],a:1,w:'Guaranteed fast doubling is a classic scam.'},
       {k:'tf',q:'Bitcoin’s price can drop a lot in a short time.',a:true,w:'True. That’s volatility.'},
       {k:'mc',q:'Before buying any crypto, a kid should…',o:['Ask a trusted adult','Use a parent’s card secretly','Follow an online stranger’s tip'],a:0,w:'Always involve a trusted adult.'}]}]},
 {id:'w8',g:'new',t:'The Open Network',d:'Decentralization and DeFi',ic:'net',c:'#2A9DB5',L:[
  {id:'d1',t:'Who’s in charge?',terms:['Centralized','Decentralized'],
   teach:[{h:'One boss, or many?',b:'<p><b>Centralized</b> means one company or person is in charge, like a bank deciding who gets a loan.</p><p><b>Decentralized</b> means control is spread across many people or computers following shared rules, like Bitcoin.</p><div class="ex"><b>Trade-offs</b>Centralized: customer service, but one point of control.<br>Decentralized: no single boss, but you’re responsible for your own mistakes.</div>'}],
   qs:[{k:'match',q:'Centralized or decentralized?',p:[['A big bank','Centralized'],['The Bitcoin network','Decentralized'],['A video app owned by one company','Centralized']],w:'Who holds the control decides it.'},
       {k:'tf',q:'In a decentralized system, there’s usually no customer service to undo your mistakes.',a:true,w:'True. More freedom, more responsibility.'},
       {k:'mc',q:'A benefit of decentralization is…',o:['No single company can shut you out','Someone always fixes your mistakes','It can never have problems'],a:0,w:'Control is spread out, so no one gatekeeper.'}]},
  {id:'d2',t:'DeFi and smart contracts',terms:['Smart contract','DeFi','Stablecoin'],
   teach:[{h:'Programs that move money',b:'<p>A <b>smart contract</b> is a program on a blockchain (like Ethereum) that runs exactly as written: “if this happens, send that.”</p><p><b>DeFi</b> means decentralized finance: apps built from smart contracts that let people lend, borrow and trade without a bank.</p><p>A <b>stablecoin</b> is a crypto coin designed to stay worth about $1.</p>'}],
   qs:[{k:'mc',q:'A smart contract is…',o:['A paper contract signed by a lawyer','A program that runs on a blockchain','A bank account'],a:1,w:'It’s code that runs automatically.'},
       {k:'mc',q:'DeFi stands for…',o:['Decentralized finance','Deposit fees','Defensive finance'],a:0,w:'Decentralized finance: money apps without a bank in the middle.'},

var DEF={'Barter':'Trading one thing for another, with no money.','Money':'Anything people agree has value. It buys things, measures prices and saves value for later.','Need':'Something you must have to live and be safe, like food or a home.','Want':'Something nice to have that you could live without.','Income':'Money that comes in, like pay for work.','Profit':'What’s left after you pay your costs.','Budget':'A plan for your money before you spend it.','Saving':'Keeping money for later instead of spending it now.','Goal':'Something you’re saving toward.','Interest':'Extra money paid for using money: earned when you save, paid when you borrow.','Compound interest':'Earning interest on your interest. The snowball effect.','Bank':'A business that keeps deposits safe and lends money.','Deposit':'Money you put into a bank account.','Loan':'Money you borrow and pay back, usually with interest.','Debt':'Money you owe.','Credit card':'A card that lets you buy now and pay later. Unpaid balances grow with high interest.','Credit score':'A number, about 300 to 900 in Canada, that shows how well you repay borrowed money.','Stock':'A slice of ownership in a company.','Shareholder':'Someone who owns shares in a company.','Dividend':'Part of a company’s profits paid to its owners.','ETF':'A basket of many investments you can buy in one go.','Option':'A contract that gives someone the right to buy or sell at a set price.','Covered call':'Getting paid now for promising to sell a share you own at a set price.','Premium':'The money paid up front for an option.','Rule of 72':'72 divided by the yearly growth rate tells you roughly how many years it takes to double.','Rent':'Paying to live in a home someone else owns.','Mortgage':'A loan to buy a home, paid back over many years.','Equity':'The part of something you truly own: its value minus what you owe.','Down payment':'The part of a home’s price you pay up front.','Cash flow':'Money left each month after all the costs.','REIT':'A company that owns many buildings. You can buy a slice like a stock.','Supply':'How much of something there is.','Demand':'How many people want something.','Inflation':'Prices rising over time, so each dollar buys a little less.','Central bank':'The bank that sets a country’s main interest rate, like the Bank of Canada.','Taxes':'Money people and businesses pay to fund shared things like roads and schools.','Bitcoin':'Digital money run by a network of computers, capped at 21 million coins.','Blockchain':'A shared record of transactions that many computers keep and check.','Wallet':'Software or a device that holds the keys to your crypto.','Private key':'The secret code that controls crypto. Never share it.','Volatility':'How much and how fast a price moves up and down.','Scam':'A trick to take your money, often promising easy riches.','Centralized':'One company or person is in charge.','Decentralized':'Control is spread across many people or computers following shared rules.','Smart contract':'A program on a blockchain that runs exactly as written.','DeFi':'Decentralized finance: money apps built from smart contracts, without a bank.','Stablecoin':'A crypto coin designed to stay worth about $1.','Hack':'When someone breaks in through a weakness and steals.','Artificial intelligence':'Software that learns patterns from lots of examples.','Automation':'Machines or software doing tasks people used to do.','Asset':'Something you own that can earn money or grow in value.','Financial freedom':'When your assets pay for your life, so work becomes a choice.'};

   '<div class="card"><h3>Settings</h3><div class="row"><b>Sounds</b><button type="button" class="sw" role="switch" aria-checked="'+S.sound+'" data-set="sound" aria-label="Sounds"></button></div><div class="row"><b>Bible verses after lessons</b><button type="button" class="sw" role="switch" aria-checked="'+verses()+'" data-set="verses" aria-label="Bible verses"></button></div><div class="row"><span style="color:var(--muted);font-weight:700">'+n+' of '+ALL.length+' lessons done · '+S.coins+' coins</span><button type="button" class="btn2 danger" data-set="reset">Reset progress</button></div></div>'+
   '<p style="color:var(--muted);font-weight:700;font-size:14px">Made by <a href="/" style="color:inherit">Melius One</a>. Grown-ups can try <a href="/app/" style="color:inherit">Melius Money</a> for the family budget.</p>'}
function sheet(t,b,yes,cb){var d=document.createElement('div');d.className='sheet';d.innerHTML='<div class="in" role="dialog" aria-modal="true"><h3>'+t+'</h3><p>'+b+'</p><button type="button" class="cta" data-y>'+yes+'</button><button type="button" class="cta ghost" data-n>Not now</button></div>';document.body.appendChild(d);d.addEventListener('click',function(e){if(e.target===d||e.target.closest('[data-n]'))d.remove();else if(e.target.closest('[data-y]')){d.remove();cb()}});d.querySelector('[data-y]').focus()}
document.querySelectorAll('.tabs [data-v]').forEach(function(b){b.addEventListener('click',function(){view=b.dataset.v;openW=null;render();scrollTo(0,0)})});
$('main').addEventListener('click',function(e){var t;
  if(t=e.target.closest('[data-w]')){openW=+t.dataset.w;render();return}
  if(e.target.closest('[data-back]')){openW=null;render();return}
  if(t=e.target.closest('[data-start]')){var it=ALL.filter(function(x){return x.l.id===t.dataset.start})[0],w=it.w,first=-1;w.L.forEach(function(l,i){if(first<0&&!S.done[l.id])first=i});
    if(!S.done[it.l.id]&&first>-1&&it.li>first){sheet('Jump ahead?','“'+it.l.t+'” comes after “'+w.L[first].t+'”. You can start it now, but the earlier lesson helps.','Start anyway',function(){start(it)});return}
    start(it);return}
  if(e.target.closest('[data-rand]')){start(ALL[Math.floor(Math.random()*ALL.length)]);return}
  if(t=e.target.closest('[data-set]')){var k=t.dataset.set;
    if(k==='sound'){S.sound=!S.sound;save();render();if(S.sound)tone([660,880])}
    if(k==='verses'){try{localStorage.setItem('melius-verses',verses()?'off':'on')}catch(x){}render()}
    if(k==='reset')sheet('Reset all progress?','All coins, stars and badges on this device will be cleared.','Reset',function(){S={done:{},coins:0,days:[],sound:S.sound};save();render()})}});

/* lesson engine */
var R=null;
function start(it){var l=it.l;R={it:it,steps:l.teach.map(function(t){return {k:'teach',t:t}}).concat(l.qs.map(function(q){return {k:'q',q:q}})),pos:0,first:{},retry:[],state:'ask'};
  $('lesson').style.setProperty('--wcl',it.w.c);$('lesson').hidden=false;document.body.style.overflow='hidden';show()}
function close(){$('lesson').hidden=true;document.body.style.overflow='';R=null;render()}
$('lClose').addEventListener('click',function(){if(!R)return;if(R.state==='fin'||R.pos===0){close();return}sheet('Leave this lesson?','You’ll lose the progress in this lesson.','Leave',close)});
function bar(){$('lBar').style.width=(R.state==='fin'?100:Math.min(100,R.pos/R.steps.length*100))+'%'}
function ft(cls,fb,label,dis){$('lFt').className='lft'+(cls?' '+cls:'');$('fb').className='fb'+(fb?' on':'');$('fb').innerHTML=fb||'';$('lGo').textContent=label;$('lGo').disabled=!!dis}
function show(){var st=R.steps[R.pos],h='';R.state='ask';R.pick=null;bar();$('lBody').scrollTop=0;
  if(st.k==='teach'){$('lIn').innerHTML='<p class="kind">'+esc(R.it.w.t)+' · '+esc(R.it.l.t)+'</p><h2 id="lTitle">'+st.t.h+'</h2><div class="teach">'+sproutSvg(R.pos===0?'happy':'wow')+'<div>'+st.t.b+'</div></div>';ft('','','Continue');R.state='teach';return}
  var q=st.q;h='<p class="kind">'+(st.retry?'Try again':{mc:'Pick one',tf:'True or false?',num:'Work it out',match:'Match the pairs'}[q.k])+'</p><h2 id="lTitle">'+esc(q.q)+'</h2>';
  if(q.k==='mc')h+='<div class="opts">'+q.o.map(function(o,j){return '<button type="button" class="opt" data-o="'+j+'" aria-pressed="false"><span class="k">'+(j+1)+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
  if(q.k==='tf')h+='<div class="opts tf"><button type="button" class="opt" data-o="1" aria-pressed="false">True</button><button type="button" class="opt" data-o="0" aria-pressed="false">False</button></div>';
  if(q.k==='num')h+='<label class="numq" id="nq">'+(q.pre?'<span>'+q.pre+'</span>':'')+'<input id="nIn" type="text" inputmode="decimal" autocomplete="off" placeholder="?" aria-label="Your answer">'+(q.suf?'<span>'+q.suf+'</span>':'')+'</label>';
  if(q.k==='match'){var L2=q.p.map(function(x,j){return j}),R2=L2.slice().sort(function(){return Math.random()-.5});
    h+='<div class="match"><div class="col">'+L2.map(function(j){return '<button type="button" class="opt" data-l="'+j+'" aria-pressed="false">'+esc(q.p[j][0])+'</button>'}).join('')+'</div><div class="col">'+R2.map(function(j){return '<button type="button" class="opt" data-r="'+j+'" aria-pressed="false">'+esc(q.p[j][1])+'</button>'}).join('')+'</div></div>';R.m={l:null,r:null,left:q.p.length,bad:0}}
  $('lIn').innerHTML=h;ft('','',q.k==='match'?'Match them all':'Check',true);
  if(q.k==='num'){var n=$('nIn');n.addEventListener('input',function(){$('lGo').disabled=!n.value.trim()});n.addEventListener('keydown',function(e){if(e.key==='Enter'&&n.value.trim())$('lGo').click()})}}
$('lIn').addEventListener('click',function(e){if(!R||R.state!=='ask')return;var q=R.steps[R.pos].q;
  var o=e.target.closest('[data-o]');if(o&&(q.k==='mc'||q.k==='tf')){$('lIn').querySelectorAll('[data-o]').forEach(function(b){b.setAttribute('aria-pressed',String(b===o))});R.pick=+o.dataset.o;$('lGo').disabled=false;tone([520]);return}
  if(q.k!=='match')return;var l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]'),b=l||r;if(!b||b.disabled)return;var side=l?'l':'r';
  $('lIn').querySelectorAll('[data-'+side+']').forEach(function(x){if(!x.disabled)x.setAttribute('aria-pressed',String(x===b))});R.m[side]=+b.dataset[side];
  if(R.m.l!=null&&R.m.r!=null){var bl=$('lIn').querySelector('[data-l="'+R.m.l+'"]'),br=$('lIn').querySelector('[data-r="'+R.m.r+'"]');
    if(q.p[R.m.l][1]===q.p[R.m.r][1]){[bl,br].forEach(function(x){x.classList.add('gone');x.disabled=true;x.setAttribute('aria-pressed','false')});R.m.left--;tone([660,880]);buzz(15)}
    else{R.m.bad++;tone([220]);[bl,br].forEach(function(x){x.classList.add('no','shake');setTimeout(function(){x.classList.remove('no','shake');x.setAttribute('aria-pressed','false')},450)});buzz([30,40,30])}
    R.m.l=R.m.r=null;if(!R.m.left)grade(R.m.bad===0)}});
function parseNum(s){s=String(s).replace(/[,$%\s]/g,'').replace(/million$/i,'');var v=parseFloat(s);return isNaN(v)?null:v}
var YES=['Awesome!','You got it!','Money genius!','Nailed it!','Super smart!','Yes!'],NO=['Not quite','Almost!','Good try'];
function grade(ok){var st=R.steps[R.pos],q=st.q;R.state='graded';
  if(q.k==='mc'||q.k==='tf'){var ans=q.k==='tf'?(q.a?1:0):q.a;$('lIn').querySelectorAll('[data-o]').forEach(function(b){b.disabled=true;var v=+b.dataset.o;if(v===ans)b.classList.add('ok');else if(v===R.pick)b.classList.add('no')})}
  if(q.k==='num'){$('nIn').readOnly=true;$('nq').classList.add(ok?'ok':'no')}
  if(!st.retry&&!R.first[R.pos])R.first[R.pos]=ok?'ok':'no';
  if(!ok)R.retry.push({k:'q',q:q,retry:1});
  var right=q.k==='num'?'The answer is '+(q.pre||'')+(q.dec?q.a.toFixed(q.dec):Number(q.a).toLocaleString('en-CA'))+(q.suf?' '+q.suf:'')+'. ':'';
  ft(ok?'ok':'no',sproutSvg(ok?'wow':'hmm')+'<div><h3>'+(ok?YES[Math.floor(Math.random()*YES.length)]:NO[Math.floor(Math.random()*NO.length)])+'</h3><p>'+(ok?'':esc(right))+esc(q.w)+(ok||st.retry?'':' We’ll try it again in a bit.')+'</p></div>','Continue');
  if(ok){tone([660,880]);buzz(20)}else{tone([300,220]);buzz([40,50,40])}$('lGo').focus()}
$('lGo').addEventListener('click',function(){if(!R)return;
  if(R.state==='fin'){close();return}
  if(R.state==='teach'||R.state==='graded'){R.pos++;if(R.pos>=R.steps.length&&R.retry.length){R.steps=R.steps.concat(R.retry);R.retry=[]}if(R.pos>=R.steps.length){finish();return}show();return}
  var q=R.steps[R.pos].q;
  if(q.k==='mc')grade(R.pick===q.a);else if(q.k==='tf')grade((R.pick===1)===q.a);
  else if(q.k==='num'){var v=parseNum($('nIn').value);grade(v!=null&&Math.abs(v-q.a)<=(q.tol||0)+1e-9)}});
document.addEventListener('keydown',function(e){if(!R||R.state!=='ask')return;var q=R.steps[R.pos].q;if(!q)return;if(q.k==='mc'&&/^[1-9]$/.test(e.key)){var b=$('lIn').querySelector('[data-o="'+(+e.key-1)+'"]');if(b)b.click()}if(e.key==='Enter'&&!$('lGo').disabled&&q.k!=='num')$('lGo').click()});
function finish(){var l=R.it.l,qn=0,ok=0;Object.keys(R.first).forEach(function(k){qn++;if(R.first[k]==='ok')ok++});
  var acc=qn?ok/qn:1,stars=acc===1?3:acc>=0.6?2:1,first=!S.done[l.id],lv0=level(),coins=10+(stars===3?5:0),t=dk();
  var rec=S.done[l.id]||{stars:0,log:[]};rec.stars=Math.max(rec.stars,stars);rec.log=(rec.log||[]).concat(t).slice(-20);S.done[l.id]=rec;S.coins+=coins;if(S.days.indexOf(t)<0)S.days.push(t);S.days=S.days.slice(-400);S.best=Math.max(S.best||0,streak());save();
  R.state='fin';bar();var lv=level(),v=verses()?VERSES[Math.floor(Math.random()*VERSES.length)]:null,wdone=wDone(R.it.w)===R.it.w.L.length&&first;
  $('lIn').innerHTML='<div class="done">'+sproutSvg('wow')+'<h2 id="lTitle">'+(stars===3?'Perfect!':'Lesson complete!')+'</h2><div class="stars" aria-label="'+stars+' of 3 stars">'+'★★★'.slice(0,stars)+'<s>'+'★★★'.slice(0,3-stars)+'</s></div>'+
    (lv>lv0?'<div class="lvlup">Your Money Tree grew to level '+lv+'!</div>':'')+(wdone?'<div class="lvlup" style="background:'+R.it.w.c+';color:#fff">'+esc(R.it.w.t)+' badge earned!</div>':'')+
    '<div class="stats"><div class="stat"><span>Coins</span><b>+'+coins+'</b></div><div class="stat"><span>Correct</span><b>'+ok+'/'+qn+'</b></div><div class="stat"><span>Streak</span><b>'+streak()+'</b></div></div>'+
    '<div class="learned"><b>Money words</b><div>'+l.terms.map(function(x){return '<span class="tchip">'+esc(x)+'</span>'}).join('')+'</div></div>'+(v?'<p class="verse">“'+esc(v[0])+'”<small>'+v[1]+' · BSB</small></p>':'')+'</div>';
  ft('','','Continue');tone([523,659,784,1047]);confetti();try{gtag('event','quest_done',{lesson:l.id,stars:stars})}catch(x){}}
render();
})();

</script>
